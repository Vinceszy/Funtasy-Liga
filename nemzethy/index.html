<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nemzethy Sport — Heti Funtasy Magazin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- A betukeszlet-ivet NEM blokkolokent toltjuk. Egy sima <link rel=stylesheet>
     megallitja a lap megjeleneset, amig a Google valaszol: kimerve DOMContentLoaded
     57 ms helyett 12,6 MASODPERC, ha a fonts.googleapis.com nem elerheto - addig
     a lapon SEMMI nincs. A media="print" + onload trukk aszinkronna teszi: a
     tartalom azonnal latszik a tartalek betuvel (a `display=swap` miatt ugyis az
     lenne az elso festes), es a webfont akkor lep be, amikor megjott. -->
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<noscript><link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap"></noscript>
<link rel="stylesheet" href="../funtasy.css?v=107">
</head>
<body class="kezdolap">
<div class="wrap">
<noscript><div class="note nojs">Ehhez az oldalhoz <b>JavaScript</b> kell: a cikkeket a
  böngésző tölti be a mentett adatokból. JavaScript nélkül csak az üres keret látszik.</div></noscript>
<div class="liganav" id="liganav"></div>
<header class="maghead">
  <h1 class="magcim" id="magCim">Nemzethy Sport</h1>
  <div class="magszlogen" id="magSzlogen">Heti Funtasy Magazin</div>
</header>

<div class="panel magpanel">
  <div class="magszurok" id="magSzuroSav"></div>
  <div id="lista" class="maglista"><div class="vlt-ures">Betöltés…</div></div>
</div>
<a class="ujdonsagsor" id="magMasik" href="./" style="display:none">
  <span class="cim"></span>
  <span class="leiras"></span>
  <span class="tovabb">→</span>
</a>
</div>
<div class="lablec" id="lablec"></div>

<script src="../funtasy.js?v=107"></script>
<script>
// ======= NEMZETHY SPORT =======
// Egy helyen az osszes iras, fordulonkent visszafele. A meccs adatlapjan a
// sav arra valaszol, mi tortent AZON a meccsen; ide az jon, aki hetfon
// egyben olvasna vegig az egeszet.
//
// KET UZEMMOD. `?liga=nb1` eseten AZ ADOTT LIGA ujsagja: a liga sajat
// szineivel, a liga nevevel a fejlecben, es csak az o irasaival - a felso
// savban innen nyilik, tehat a nezo nem esik ki a liga vilagabol. Parameter
// nelkul a kozos kiadas, liga-szurovel; erre a kezdolap mutat.
//
// A KAPU UGYANAZ, mint a meccs adatlapjan: le nem zart fordulonak csak a
// beharangozoja latszik. A valasztast a FunTasy.articleList vegzi - ha itt
// ujra megirodna, a ket nezet elcsuszhatna abban, mit szabad mutatni.
const $ = id => document.getElementById(id);
const LIGA = (new URLSearchParams(location.search).get('liga') || '').toLowerCase();
const LIGAOBJ = FunTasy.liga(LIGA);
FunTasy.renderNav(LIGAOBJ ? LIGA : null, '../', { szakasz: 'ujsag' });
FunTasy.renderLablec('../', 'nemzethy');
FunTasy.verzioOr();
FunTasy.watchMagazine();

// Liga-uzemmodban az oldal atveszi a liga temajat es nevet: ez a liga sajat
// ujsagja, nem egy szuro egy kozos lapon.
if (LIGAOBJ){
  document.body.className = LIGAOBJ.tema;
  document.title = `${FunTasy.UJSAG_NEV} ${LIGAOBJ.nev} — ${FunTasy.UJSAG_MOTTO}`;
  $('magCim').innerHTML = `${FunTasy.esc(FunTasy.UJSAG_NEV)} <span class="tag">${
    FunTasy.esc(LIGAOBJ.nev)}</span>`;

  $('magSzuroSav').style.display = 'none';
}
// A masik kiadasra mutato sor: ligabol a kozosre, kozosbol nincs mire.
if (LIGAOBJ){
  const a = $('magMasik');
  a.href = './';
  a.querySelector('.cim').textContent = 'Mindkét liga egyben';
  a.querySelector('.leiras').textContent = 'A közös kiadás: az NB1 és a PL írásai egy lapon.';
  a.style.display = '';
}

let CIKKEK = null, ZART = { nb1: new Set(), pl: new Set() };
// Nev -> ember. A ket liga mas neven ismeri ugyanazt a szakvezetot (NB1-ben
// becenev, PL-ben csapatnev), es a kozos kiadasban EGY emberkent kell
// megjelennie - a tabla a kozos retegben all. A PL-oldali nevet a draft.json
// adja: amig az meg nem jott, mindenki a sajat neven all, es mivel a szurot
// ugyis a betoltes utan rajzoljuk, ez sehol nem latszik.
let SZEMELY = FunTasy.szemelyTar(null);
// Negy szempont, egymastol fuggetlenul. Mindegyik "Mind"-del indul, es
// mindegyik CSAK azokat az ertekeket kinalja, amik a tobbi szuro mellett
// tenylegesen leteznek - kulonben ures talalati listara lehetne kattintani.
const SZURO = { liga: 'mind', ki: 'mind', fordulo: 'mind', fajta: 'mind' };
// A rovat neve a kozos retegbol jon: a cikk kartyajan es itt a szuroben
// ugyanannak kell allnia.
const FAJTANEV = FunTasy.rovatNev;

const opcional = u => fetch(u + '?t=' + Date.now())
  .then(r => r.ok ? r.json() : null).catch(() => null);

// Melyik fordulo vegleges? Ugyanabbol, amibol a ket liga-oldal tudja:
// az NB1-nel az eredmeny mar a menetrendben all (a folyamatban levot a
// gyujto "provisional"-kent jeloli), a Draftnal a kulon veglegesitett lista.
function zarasBetolt(res, hist){
  if (res && res.schedule){
    const ideiglenes = new Set((res.provisional || []).map(Number));
    for (const r in res.schedule){
      if (ideiglenes.has(+r)) continue;
      if ((res.schedule[r] || []).some(m => FunTasy.played(m))) ZART.nb1.add(+r);
    }
  }
  if (hist) for (const r of (hist.veglegesek || [])) ZART.pl.add(+r);
}
const zartE = (liga, fordulo) => (ZART[liga] || new Set()).has(+fordulo);

// Egy cikk atmegy-e a szuron, egy szempontot kihagyva. A kihagyas kell
// ahhoz, hogy az adott szempont valasztekat a TOBBI szuro mellett letezo
// ertekekbol allitsuk ossze: a sajat ertekere szurve ugyanis mindig csak
// egy ertek maradna, es nem lehetne atvaltani rola.
// A heti rovatnak nincs ellenfele, es nincs szakvezetoje sem: a cime all a
// `hazai` helyen. Az emberre szuresbol ezert kimarad - nem senkihez tartozik,
// hanem mindenkihez.
const emberE = (be, kulcs) => !!be.vendeg
  && (SZEMELY(be.hazai).kulcs === kulcs || SZEMELY(be.vendeg).kulcs === kulcs);
const atmegy = (be, kiveve) => {
  const k = [].concat(kiveve || []);
  const ki = n => k.indexOf(n) >= 0;
  return (ki('liga')    || SZURO.liga    === 'mind' || be.liga === SZURO.liga) &&
         (ki('ki')      || SZURO.ki      === 'mind' || emberE(be, SZURO.ki)) &&
         (ki('fordulo') || SZURO.fordulo === 'mind' || String(be.fordulo) === SZURO.fordulo) &&
         (ki('fajta')   || SZURO.fajta   === 'mind' || be.fajta === SZURO.fajta);
};

// Legordulo, nem gombsor. Tizennyolc szakvezeto-gomb harom sorban tobb
// helyet vett el, mint amennyi cikk latszott alatta; a legordulo egy sor,
// es telefonon a rendszer sajat valasztojat nyitja meg.
const opcio = (ertek, felirat, kivalasztott) =>
  `<option value="${FunTasy.esc(ertek)}"${kivalasztott ? ' selected' : ''}>${
    FunTasy.esc(felirat)}</option>`;

function gombsor(nev, cim, ertekek){
  if (ertekek.length < 2) return '';
  const o = [['mind', cim]].concat(ertekek)
    .map(([e, f]) => opcio(e, f, SZURO[nev] === e)).join('');
  return `<select class="magszuro${SZURO[nev] === 'mind' ? '' : ' on'}" ` +
         `data-szuro="${nev}" aria-label="${FunTasy.esc(cim)}">${o}</select>`;
}

// Kik szerepelnek a szuresben - EMBERENKENT, nem nevenkent. Aki mindket
// ligaban jatszik, EGY sor: a ket neve egyben all a feliratban, es rea
// szurve mindket liga irasai eljonnek - kulonben ketszer szerepelne, ket
// kulon szakvezetokent, pedig egy ember.
function emberek(mind, kiveve){
  // Ha ugyis egy ligat nezunk, a masik liganev nem mond semmit: ott
  // mindenki az ITTENI neven all.
  const egyLiga = LIGAOBJ || SZURO.liga !== 'mind';
  const nep = new Map();
  for (const be of mind) if (atmegy(be, kiveve))
    for (const n of [be.hazai, be.vendeg].filter(x => be.vendeg && x)){
      const sz = SZEMELY(n);
      if (!nep.has(sz.kulcs)) nep.set(sz.kulcs, egyLiga ? n : sz.felirat);
    }
  return [...nep.entries()].sort((a, b) => a[1].localeCompare(b[1], 'hu'));
}

function szuroRajz(mind){
  const egyedi = (kiveve, kulcs) => {
    const k = [];
    for (const be of mind) if (atmegy(be, kiveve)) for (const x of [].concat(kulcs(be)))
      if (!k.includes(x)) k.push(x);
    return k;
  };
  let h = '';
  // Negy KULON szuro. A liga es a szakvezeto egy ideig egy vezerlon osztozott,
  // azzal az indokkal, hogy egy szakvezeto ugyis egy ligahoz tartozik - ez nem
  // igaz: aki mindket ligaban jatszik, egy ember, es a ket szempont fuggetlen.
  // Igy "Vince + NB1" is kerdezheto, es egyik lista sem rejti el a masikat.
  // A liga-szuro a liga sajat ujsagjaban magatol elmarad: ott egy liga van,
  // egy ertek mellett pedig a gombsor ures marad.
  h += gombsor('liga', 'Liga',
    FunTasy.LIGAK.filter(l => mind.some(be => be.liga === l.id && atmegy(be, 'liga')))
      .map(l => [l.id, l.nev]));
  h += gombsor('ki', 'Szakvezető', emberek(mind, 'ki'));
  h += gombsor('fordulo', 'Forduló',
    egyedi('fordulo', b => String(b.fordulo)).sort((a, b) => b - a)
      .map(r => [r, r + '.']));
  h += gombsor('fajta', 'Típus',
    egyedi('fajta', b => b.fajta).map(f => [f, FAJTANEV(f)]));
  // A szamlalo a szurok MELLE kerul, nem alajuk: egy sorral kevesebb.
  const lathato = FunTasy.articleList(CIKKEK, zartE)
    .filter(x => (!LIGAOBJ || x.liga === LIGA) && atmegy(x, null)).length;
  const szur = Object.values(SZURO).some(x => x !== 'mind');
  $('magSzuroSav').innerHTML = h +
    `<span class="magszam">${lathato}${szur ? ' / ' + mind.length : ''} írás</span>` +
    (szur ? '<button class="magtorol" data-szuro="mind">Szűrők törlése</button>' : '');
  $('magSzuroSav').style.display = (h || szur) ? '' : 'none';
}

function rajzol(){
  const mind = FunTasy.articleList(CIKKEK, zartE)
    .filter(x => !LIGAOBJ || x.liga === LIGA);
  szuroRajz(mind);
  const lista = mind.filter(x => atmegy(x, null));
  if (!lista.length){
    $('lista').innerHTML = '<div class="vlt-ures">Erre a szűrésre nincs írás.</div>';
    return;
  }
  // Liganként egy cim, alatta a fordulok visszafele - az articleList mar
  // ebben a sorrendben adja vissza. A liga sajat ujsagjaban a cim felesleges:
  // a fejlecben ugyis az all.
  let h = '', elozoLiga = null;
  for (const be of lista){
    if (!LIGAOBJ && be.liga !== elozoLiga){
      elozoLiga = be.liga;
      // A liga ROVID neve eleg: a hosszu leiras ("NB1 salary cap fantasy")
      // minden blokk folott elvenne egy sort abbol, amiert ide jott a nezo.
      h += `<h2 class="magliga">${FunTasy.esc(FunTasy.liga(be.liga).nev)}</h2>`;
    }
    h += FunTasy.articleCardHTML(be);
  }
  $('lista').innerHTML = h;
  // A hivatkozassal erkezot odavisszuk, ahova jott (a "Masolom" ilyet ad).
  // KETSZER: a kepernyon kivuli cikkek magassaga eloszor csak BECSLES
  // (content-visibility), tehat az elso ugras melle mehet; mire a masodik
  // fut, a kozbeeso cikkek valodi merete mar megvan.
  if (location.hash){
    const ugras = () => {
      const cel = document.getElementById(location.hash.slice(1));
      if (cel) cel.scrollIntoView();
    };
    ugras();
    requestAnimationFrame(() => requestAnimationFrame(ugras));
  }
}

document.addEventListener('change', e => {
  const g = e.target.closest('select[data-szuro]');
  if (!g) return;
  SZURO[g.getAttribute('data-szuro')] = g.value;
  rajzol();
});
document.addEventListener('click', e => {
  if (!e.target.closest('.magtorol')) return;
  for (const k in SZURO) SZURO[k] = 'mind';
  rajzol();
});

Promise.all([opcional('../articles.json'),
             FunTasy.articleDraftMode() ? opcional('../articles-draft.json') : null,
             opcional('../results.json'), opcional('../draft_history.json'),
             // Csak a kozos kiadasnak kell: ebbol derul ki, melyik csapatnev
             // melyik azonositohoz tartozik, vagyis kit kell egy emberkent
             // mutatni a ket ligabol. A liga sajat ujsagjaban nincs mit
             // osszekotni, ott ez a keres el is marad.
             LIGAOBJ ? null : opcional('../draft.json')])
  .then(([kint, vazlat, res, hist, draft]) => {
    zarasBetolt(res, hist);
    SZEMELY = FunTasy.szemelyTar(draft && draft.entries);
    CIKKEK = FunTasy.mergeArticles(kint, vazlat) || { leagues: {} };
    rajzol();
  })
  .catch(() => { $('lista').innerHTML =
    '<div class="vlt-ures">Az írásokat most nem sikerült betölteni.</div>'; });
</script>
</body>
</html>
