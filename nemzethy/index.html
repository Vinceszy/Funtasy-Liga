<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nemzethy Sport — Heti Funtasy Magazin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The font stylesheet is NOT loaded as render-blocking. A plain <link rel=stylesheet>
     holds back the page until Google answers: measured DOMContentLoaded at
     12.6 SECONDS instead of 57 ms when fonts.googleapis.com is unreachable - until
     then there is NOTHING on the page. The media="print" + onload trick makes it
     asynchronous: the content shows at once in the fallback font (with `display=swap`
     that would be the first paint anyway), and the web font steps in when it arrives. -->
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<noscript><link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap"></noscript>
<link rel="stylesheet" href="../funtasy.css?v=121">
</head>
<body class="kezdolap">
<div class="wrap">
<noscript><div class="note nojs">Ehhez az oldalhoz <b>JavaScript</b> kell: a cikkeket a
  böngésző tölti be a mentett adatokból. JavaScript nélkül csak az üres keret látszik.</div></noscript>
<div class="liganav" id="liganav"></div>
<header class="maghead">
  <h1 class="magcim" id="magCim">Nemzethy Sport</h1>
  <div class="magszlogen" id="magSzlogen">Heti Funtasy Magazin</div>
</header>

<div class="panel magpanel">
  <div class="magszurok" id="magSzuroSav"></div>
  <div id="lista" class="maglista"><div class="vlt-ures">Betöltés…</div></div>
</div>
<a class="ujdonsagsor" id="magMasik" href="./" style="display:none">
  <span class="cim"></span>
  <span class="leiras"></span>
  <span class="tovabb">→</span>
</a>
</div>
<div class="lablec" id="lablec"></div>

<script src="../funtasy.js?v=121"></script>
<script>
// ======= NEMZETHY SPORT =======
// Every piece of writing in one place, round by round backwards. On the
// match page the strip answers what happened in THAT match; this page is
// for someone who wants to read the lot in one go on a Monday.
//
// TWO MODES. With `?liga=nb1` it is THE GIVEN LEAGUE's magazine: in the
// league's own colours, with the league's name in the header, and only its
// pieces - it is opened from the top bar, so the viewer does not drop out
// of the league's world. Without a parameter it is the joint edition, with
// a league filter; the home page points there.
//
// THE GATE IS THE SAME as on the match page: a round not closed yet only
// shows its preview. The selection is done by FunTasy.articleList - written
// again here, the two views could drift apart on what may be shown.
const $ = id => document.getElementById(id);
const LEAGUE = (new URLSearchParams(location.search).get('liga') || '').toLowerCase();
const LEAGUE_OBJ = FunTasy.leagueById(LEAGUE);
FunTasy.renderNav(LEAGUE_OBJ ? LEAGUE : null, '../', { section: 'ujsag' });
FunTasy.renderFooter('../', 'nemzethy');
FunTasy.reloadIfStale();
FunTasy.watchMagazine();

// In league mode the page takes over the league's theme and name: this is
// the league's own magazine, not a filter on a shared page.
if (LEAGUE_OBJ){
  document.body.className = LEAGUE_OBJ.theme;
  document.title = `${FunTasy.MAGAZINE_NAME} ${LEAGUE_OBJ.name} — ${FunTasy.MAGAZINE_MOTTO}`;
  $('magCim').innerHTML = `${FunTasy.esc(FunTasy.MAGAZINE_NAME)} <span class="tag">${
    FunTasy.esc(LEAGUE_OBJ.name)}</span>`;

  $('magSzuroSav').style.display = 'none';
}
// The row pointing to the other edition: from a league to the joint one;
// from the joint one there is nowhere to point.
if (LEAGUE_OBJ){
  const a = $('magMasik');
  a.href = './';
  a.querySelector('.cim').textContent = 'Mindkét liga egyben';
  a.querySelector('.leiras').textContent = 'A közös kiadás: az NB1 és a PL írásai egy lapon.';
  a.style.display = '';
}

let ARTICLE_STORE = null, CLOSED = { nb1: new Set(), pl: new Set() };
// Name -> person. The two leagues know the same manager by different names
// (a nickname in NB1, a team name in PL), and in the joint edition they
// must appear as ONE person - the table lives in the shared layer. The PL
// side's names come from draft.json: until it arrives everyone stands
// under their own name, and since the filter is drawn after loading
// anyway, this shows nowhere.
let PERSON = FunTasy.personLookup(null);
// Four criteria, independent of each other. Each starts with "Mind" (all),
// and each offers ONLY the values that actually exist alongside the other
// filters - otherwise one could click into an empty result list.
const FILTER = { liga: 'mind', ki: 'mind', fordulo: 'mind', fajta: 'mind' };
// The column name comes from the shared layer: the article card and this
// filter must show the same.
const KIND_NAME = FunTasy.articleKindName;

const optional = u => fetch(u + '?t=' + Date.now())
  .then(r => r.ok ? r.json() : null).catch(() => null);

// Which round is final? From the same data the two league pages know it
// from: on NB1 the result is already in the schedule (the collector marks
// the one in progress as "provisional"), on the Draft the separately
// finalised list.
function loadClosed(res, hist){
  if (res && res.schedule){
    const provisional = new Set((res.provisional || []).map(Number));
    for (const r in res.schedule){
      if (provisional.has(+r)) continue;
      if ((res.schedule[r] || []).some(m => FunTasy.played(m))) CLOSED.nb1.add(+r);
    }
  }
  if (hist) for (const r of (hist.veglegesek || [])) CLOSED.pl.add(+r);
}
const isClosed = (league, round) => (CLOSED[league] || new Set()).has(+round);

// Whether an article passes the filter, leaving out one criterion. Leaving
// it out is needed so that a criterion's choices are built from the values
// existing alongside the OTHER filters: filtered on its own value there
// would always be just one value left, and one could not switch away from it.
// The weekly column has no opponent and no manager either: its title stands
// in the `hazai` (home) slot. So it is left out of filtering by person - it
// belongs not to nobody but to everybody.
const isPerson = (entry, key) => !!entry.vendeg
  && (PERSON(entry.hazai).key === key || PERSON(entry.vendeg).key === key);
const passes = (entry, except) => {
  const k = [].concat(except || []);
  const skip = n => k.indexOf(n) >= 0;
  return (skip('liga')    || FILTER.liga    === 'mind' || entry.liga === FILTER.liga) &&
         (skip('ki')      || FILTER.ki      === 'mind' || isPerson(entry, FILTER.ki)) &&
         (skip('fordulo') || FILTER.fordulo === 'mind' || String(entry.fordulo) === FILTER.fordulo) &&
         (skip('fajta')   || FILTER.fajta   === 'mind' || entry.fajta === FILTER.fajta);
};

// A dropdown, not a row of buttons. Eighteen manager buttons in three rows
// took more room than the articles visible under them; the dropdown is one
// line, and on a phone it opens the system's own picker.
const option = (value, label, selected) =>
  `<option value="${FunTasy.esc(value)}"${selected ? ' selected' : ''}>${
    FunTasy.esc(label)}</option>`;

function filterSelect(name, title, values){
  if (values.length < 2) return '';
  const o = [['mind', title]].concat(values)
    .map(([e, f]) => option(e, f, FILTER[name] === e)).join('');
  return `<select class="magszuro${FILTER[name] === 'mind' ? '' : ' on'}" ` +
         `data-szuro="${name}" aria-label="${FunTasy.esc(title)}">${o}</select>`;
}

// Who appears in the filter - BY PERSON, not by name. Someone who plays in
// both leagues is ONE row: both names stand together in the label, and
// filtering on it brings the pieces of both leagues - otherwise they would
// appear twice, as two separate managers, though they are one person.
function people(allItems, except){
  // When looking at one league anyway, the other league's name says nothing:
  // there everyone stands under the name used HERE.
  const oneLeague = LEAGUE_OBJ || FILTER.liga !== 'mind';
  const byPerson = new Map();
  for (const entry of allItems) if (passes(entry, except))
    for (const n of [entry.hazai, entry.vendeg].filter(x => entry.vendeg && x)){
      const person = PERSON(n);
      if (!byPerson.has(person.key)) byPerson.set(person.key, oneLeague ? n : person.label);
    }
  return [...byPerson.entries()].sort((a, b) => a[1].localeCompare(b[1], 'hu'));
}

function drawFilters(allItems){
  const distinct = (except, key) => {
    const k = [];
    for (const entry of allItems) if (passes(entry, except)) for (const x of [].concat(key(entry)))
      if (!k.includes(x)) k.push(x);
    return k;
  };
  let h = '';
  // Four SEPARATE filters. League and manager are not one control on the
  // grounds that a manager belongs to one league anyway - that is not true:
  // someone who plays in both leagues is one person, and the two criteria
  // are independent. So "Vince + NB1" can be asked too, and neither list
  // hides the other.
  // In a league's own magazine the league filter drops out by itself: there
  // is one league, and with a single value the select stays empty.
  h += filterSelect('liga', 'Liga',
    FunTasy.LEAGUES.filter(l => allItems.some(entry => entry.liga === l.id && passes(entry, 'liga')))
      .map(l => [l.id, l.name]));
  h += filterSelect('ki', 'Szakvezető', people(allItems, 'ki'));
  h += filterSelect('fordulo', 'Forduló',
    distinct('fordulo', b => String(b.fordulo)).sort((a, b) => b - a)
      .map(r => [r, r + '.']));
  h += filterSelect('fajta', 'Típus',
    distinct('fajta', b => b.fajta).map(f => [f, KIND_NAME(f)]));
  // The counter goes NEXT TO the filters, not under them: one line less.
  const visible = FunTasy.articleList(ARTICLE_STORE, isClosed)
    .filter(x => (!LEAGUE_OBJ || x.liga === LEAGUE) && passes(x, null)).length;
  const filtered = Object.values(FILTER).some(x => x !== 'mind');
  $('magSzuroSav').innerHTML = h +
    `<span class="magszam">${visible}${filtered ? ' / ' + allItems.length : ''} írás</span>` +
    (filtered ? '<button class="magtorol" data-szuro="mind">Szűrők törlése</button>' : '');
  $('magSzuroSav').style.display = (h || filtered) ? '' : 'none';
}

function draw(){
  const allItems = FunTasy.articleList(ARTICLE_STORE, isClosed)
    .filter(x => !LEAGUE_OBJ || x.liga === LEAGUE);
  drawFilters(allItems);
  const items = allItems.filter(x => passes(x, null));
  if (!items.length){
    $('lista').innerHTML = '<div class="vlt-ures">Erre a szűrésre nincs írás.</div>';
    return;
  }
  // In ORDER OF PUBLICATION, leagues mixed - so there is no league heading:
  // in time order nearly every article would get one above it. The league's
  // name is in each article's own header instead, next to the column and
  // the round.
  let h = '';
  for (const entry of items) h += FunTasy.articleCardHTML(entry);
  $('lista').innerHTML = h;
  // Someone arriving by a link is taken to where they came for ("Másolom"
  // gives such links). TWICE: the height of off-screen articles is first
  // only an ESTIMATE (content-visibility), so the first jump can miss; by the
  // time the second one runs, the real size of the articles in between is known.
  if (location.hash){
    const jump = () => {
      const target = document.getElementById(location.hash.slice(1));
      if (target) target.scrollIntoView();
    };
    jump();
    requestAnimationFrame(() => requestAnimationFrame(jump));
  }
}

document.addEventListener('change', e => {
  const g = e.target.closest('select[data-szuro]');
  if (!g) return;
  FILTER[g.getAttribute('data-szuro')] = g.value;
  draw();
});
document.addEventListener('click', e => {
  if (!e.target.closest('.magtorol')) return;
  for (const k in FILTER) FILTER[k] = 'mind';
  draw();
});

Promise.all([optional('../articles.json'),
             optional('../results.json'), optional('../draft_history.json'),
             // Only the joint edition needs it: it tells which team name belongs to
             // which id, that is, who has to be shown as one person across the two
             // leagues. In a league's own magazine there is nothing to link, and this
             // request is skipped.
             LEAGUE_OBJ ? null : optional('../draft.json')])
  .then(([published, res, hist, draft]) => {
    loadClosed(res, hist);
    PERSON = FunTasy.personLookup(draft && draft.entries);
    ARTICLE_STORE = published || { leagues: {} };
    draw();
  })
  .catch(() => { $('lista').innerHTML =
    '<div class="vlt-ures">Az írásokat most nem sikerült betölteni.</div>'; });
</script>
</body>
</html>
