<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FunTasy — mi újult meg?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The font stylesheet is NOT loaded as render-blocking. A plain <link rel=stylesheet>
     holds back the page until Google answers: measured DOMContentLoaded at
     12.6 SECONDS instead of 57 ms when fonts.googleapis.com is unreachable - until
     then there is NOTHING on the page. The media="print" + onload trick makes it
     asynchronous: the content shows at once in the fallback font (with `display=swap`
     that would be the first paint anyway), and the web font steps in when it arrives. -->
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<noscript><link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap"></noscript>
<link rel="stylesheet" href="../funtasy.css?v=120">
</head>
<body class="kezdolap">
<div class="wrap">
<noscript><div class="note nojs">Ehhez az oldalhoz <b>JavaScript</b> kell: a táblázatokat a
  böngésző tölti fel a mentett adatokból. JavaScript nélkül csak az üres keret látszik.</div></noscript>
<div class="liganav" id="liganav"></div>
<header>
  <h1><span class="fun">FUN</span>TASY</h1>
  <div class="sub">Mi újult meg? — új funkciók és javítások</div>
</header>

<div class="panel">
  <h2>Változások</h2>
  <div class="vlt-szurok">
    <div class="vlt-szurocsoport">
      <span class="vlt-szurocim">Típus</span>
      <div class="vlt-szurosor" id="tipusSzuro"></div>
    </div>
    <div class="vlt-szurocsoport">
      <span class="vlt-szurocim">Liga</span>
      <div class="vlt-szurosor" id="ligaSzuro"></div>
    </div>
  </div>
  <div id="lista"><div class="vlt-ures">Betöltés…</div></div>
</div>
</div>

<script src="../funtasy.js?v=120"></script>
<script>
// ======= CHANGELOG =======
// A log for users, not a technical one: only what the user sees or notices
// goes in. There are two types (new feature / fix), and the leagues work
// AS TAGS: an entry can belong to several leagues, and shows when filtering
// on any of them. That matters because not everyone plays in every league.
//
// The data is in ../valtozasok.json, written by hand. One topic on one day
// gets ONE entry: if a solution took several attempts, only the final state
// goes in - the user does not care about the attempts in between.
FunTasy.renderNav(null, '../');   // league switcher bar; no footer here, because it
FunTasy.reloadIfStale();   // stale page -> reload once
                                  // would point to itself

const TYPES = [
  { id: 'funkcio', name: 'Új funkció' },
  { id: 'bugfix',  name: 'Javítás' },
];
const typeName = t => (TYPES.find(x => x.id === t) || {}).name || t;

let ENTRIES = [];
let typeFilter = null;      // null = all (the two types exclude each other)
// The leagues can be switched SEPARATELY: someone who plays in several
// leagues can select several. An empty set = all. Between the selected
// ones it is OR: an entry shows when it touches any selected league.
const leagueFilter = new Set();

const MONTHS = ['január','február','március','április','május','június',
               'július','augusztus','szeptember','október','november','december'];
// The date is read from the text, not from a Date: the UTC midnight could
// slip into the previous day in the browser's time zone.
function formatDate(s){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
  if (!m) return s || '';
  return `${+m[1]}. ${MONTHS[+m[2] - 1]} ${+m[3]}.`;
}

// One filter row. The buttons are built from the CURRENT state, so they
// have to be redrawn after a choice - drawFilters does that, in one place.
// isActive(id) says whether a button is highlighted; the "Mind" button's id is null.
function chipRow(elId, items, isActive, select){
  const box = document.getElementById(elId);
  const chip = (id, name) =>
    `<button class="vlt-chip${isActive(id) ? ' on' : ''}" data-ert="${FunTasy.esc(id == null ? '' : id)}"`
    + ` aria-pressed="${isActive(id)}">` + FunTasy.esc(name) + '</button>';
  box.innerHTML = chip(null, 'Mind') + items.map(x => chip(x.id, x.name)).join('');
  box.querySelectorAll('.vlt-chip').forEach(b => b.addEventListener('click', () => {
    select(b.dataset.ert || null);
    drawFilters();
    draw();
  }));
}
function drawFilters(){
  // type: the two exclude each other, so only one can be active at a time
  chipRow('tipusSzuro', TYPES, id => typeFilter === id, v => { typeFilter = v; });
  // league: can be switched SEPARATELY, several at once. "Mind" (all) is not
  // a choice beside the others, but clearing the selection.
  chipRow('ligaSzuro', FunTasy.LEAGUES.map(l => ({ id: l.id, name: l.name })),
          id => (id === null ? leagueFilter.size === 0 : leagueFilter.has(id)),
          v => {
            if (v === null) leagueFilter.clear();
            else if (leagueFilter.has(v)) leagueFilter.delete(v);
            else leagueFilter.add(v);
          });
}

function filtered(){
  return ENTRIES.filter(b =>
    (!typeFilter || b.tipus === typeFilter) &&
    // The league is a TAG, and several can be selected: it is enough if the
    // entry touches ANY selected league. An empty selection = all.
    (leagueFilter.size === 0 || (b.ligak || []).some(x => leagueFilter.has(x))));
}

// Paragraphs separated by an empty line. An entry is about ONE feature, but
// a feature can have several parts - in a single block of text they would
// get lost.
const paragraphs = t => String(t || '').split(/\n\s*\n/)
  .map(x => x.trim()).filter(Boolean)
  .map(x => `<p>${FunTasy.esc(x)}</p>`).join('');

function entryHTML(b){
  const tags = (b.ligak || []).map(id => {
    const l = FunTasy.leagueById(id);
    return `<span class="vlt-liga" data-liga="${FunTasy.esc(id)}">${FunTasy.esc(l ? l.name : id)}</span>`;
  }).join('');
  return `<div class="vlt-tetel" data-tipus="${FunTasy.esc(b.tipus)}">
    <div class="vlt-fejsor">
      <span class="vlt-tipus t-${FunTasy.esc(b.tipus)}">${FunTasy.esc(typeName(b.tipus))}</span>
      ${tags}
    </div>
    <h3>${FunTasy.esc(b.cim)}</h3>
    ${paragraphs(b.leiras)}
  </div>`;
}

function draw(){
  const items = filtered();
  const el = document.getElementById('lista');
  if (!items.length){
    el.innerHTML = '<div class="vlt-ures">Ehhez a szűréshez nincs bejegyzés.</div>';
    return;
  }
  // grouped by date, newest first
  const days = [];
  items.forEach(b => {
    const last = days[days.length - 1];
    if (last && last.date === b.datum) last.items.push(b);
    else days.push({ date: b.datum, items: [b] });
  });
  el.innerHTML = days.map(n =>
    `<div class="vlt-nap"><div class="vlt-datum">${FunTasy.esc(formatDate(n.date))}</div>`
    + n.items.map(entryHTML).join('') + '</div>').join('');
}

(async () => {
  try {
    const r = await fetch('../valtozasok.json?t=' + Date.now(), { cache: 'no-store' });
    const j = await r.json();
    ENTRIES = (j.bejegyzesek || []).slice()
      .sort((a, b) => (a.datum < b.datum ? 1 : a.datum > b.datum ? -1 : 0));
  } catch (e) {
    document.getElementById('lista').innerHTML =
      '<div class="vlt-ures">A változásnapló most nem elérhető.</div>';
    return;
  }
  drawFilters();
  draw();
})();
</script>
</body>
</html>
