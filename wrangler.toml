# Deploy description of the site's own CORS proxy (Cloudflare Worker).
#
# Cloudflare builds the worker from this repository: after every push to
# main it runs `npx wrangler deploy`, which reads this file and deploys
# tartalek/proxy-worker.js. Code never has to be copied by hand - the
# worker's code lives in the repository and changes together with the site.
#
# What the worker does and why it is needed: see the top of
# tartalek/proxy-worker.js and the README paragraph "Own proxy (Cloudflare
# Worker)".

name = "funtasy-liga"
main = "tartalek/proxy-worker.js"
compatibility_date = "2026-08-27"
workers_dev = true

# ---- "last known standing" store (Workers KV) ----
# The Worker remembers the rarely changing responses, and the page asks for
# them in a single request on load (/tarolt) - see tartalek/proxy-worker.js.
#
# The binding is NOT a secret: the namespace id on its own grants nothing,
# its content needs the account. So it can stand in the repository, like
# the worker's URL.
#
# If the binding were ever missing (deleted namespace, other account), the
# Worker works exactly as without it - storing is a silent no-op.
# tests/worker-store.test.js measures this separately, so nothing stops
# because of it.
[[kv_namespaces]]
binding = "TAROLT"
id = "c2289a98dd404344b53d6a6aa7e85e36"
