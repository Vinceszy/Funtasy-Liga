<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FunTasy Draft — H2H</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B1F16;--panel:#12291D;--panel2:#0E2418;--line:#2E4A38;--ink:#F2EFE6;--dim:#9DB3A4;
--amber:#FFB020;--magenta:#E5378B;--cyan:#37D5E5;--win:#3DDC84;--lose:#E5533D;--draw:#9DB3A4}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden}
img,table{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px 20px;border-bottom:3px solid var(--cyan);padding-bottom:14px;margin-bottom:22px}
h1{font-family:'Archivo Black';font-size:clamp(26px,5vw,40px);letter-spacing:.5px}
h1 .fun{color:var(--amber)}h1 .tag{color:var(--cyan)}
.sub{color:var(--dim);font-size:13px}
#status{font:500 12px 'JetBrains Mono';color:var(--dim);width:100%;min-height:16px}
#status.err{color:var(--lose)}#status.ok{color:var(--win)}
.grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px}
.grid>*{min-width:0}
@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:22px}
.panel h2{min-width:0;flex-wrap:wrap;font-family:'Archivo Black';font-size:15px;letter-spacing:1.5px;text-transform:uppercase;color:var(--cyan);
padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:600 11px Inter;letter-spacing:1px;text-transform:uppercase;color:var(--dim);text-align:right;padding:8px 10px;border-bottom:1px solid var(--line)}
th:first-child,th:nth-child(2){text-align:left}
td{padding:9px 10px;border-bottom:1px solid var(--panel2);text-align:right;font-family:'JetBrains Mono';font-size:13.5px}
td.name{font-family:Inter;font-weight:700;text-align:left;font-size:14px}
td.rank{text-align:left;color:var(--dim);width:30px}
tr:nth-child(2) td.rank{color:var(--cyan)}
td.pont{color:var(--cyan);font-weight:700;font-size:15px}
.pos{color:var(--win)}.neg{color:var(--lose)}
.mono{font-family:'JetBrains Mono';color:var(--dim);font-size:11px;font-weight:700}
.form{display:inline-flex;gap:3px;vertical-align:middle}
.dot{width:9px;height:9px;border-radius:2px;display:inline-block}
.dot.GY{background:var(--win)}.dot.V{background:var(--lose)}.dot.D{background:var(--draw)}
.roundnav{display:flex;align-items:center;gap:8px;margin-left:auto}
.roundnav button{background:var(--panel2);border:1px solid var(--line);color:var(--ink);width:30px;height:30px;border-radius:6px;cursor:pointer;font-size:15px}
.roundnav button:hover{border-color:var(--cyan)}
.roundnav select{background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:5px 8px;border-radius:6px;font:600 13px Inter}
.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--panel2)}
.match .h{text-align:right;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis}
.match .v{text-align:left;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis}
.match .winner{color:var(--cyan)}
.score{font-family:'JetBrains Mono';font-weight:700;font-size:16px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;white-space:nowrap;min-width:120px;text-align:center}
.score .na{color:var(--dim);font-weight:500}
.matrix{padding:14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.matrix table{font-size:11px}
.matrix td,.matrix th{padding:5px 6px;text-align:center;font-family:'JetBrains Mono'}
.matrix td.w{color:var(--win)}.matrix td.l{color:var(--lose)}.matrix td.d{color:var(--draw)}.matrix td.x{color:#3a5245}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.tablewrap table{min-width:100%}
.tablewrap td.name,.tablewrap th:nth-child(2){position:sticky;left:0;background:var(--panel);z-index:1}
.tablewrap td.rank,.tablewrap th:first-child{position:sticky;left:0;background:var(--panel);z-index:2}
.note{color:var(--dim);font-size:12px;padding:12px 16px;line-height:1.5}
.banner{background:var(--panel2);border-bottom:1px solid var(--line);color:var(--dim);font-size:12.5px;padding:11px 16px;line-height:1.5}
.banner b{color:var(--cyan)}
@media(max-width:640px){
  .wrap{padding:12px 10px 40px}
  header{gap:8px 12px;padding-bottom:10px;margin-bottom:14px}
  h1{font-size:26px;width:100%}
  .sub{font-size:11px;width:100%}
  #status{font-size:11px}
  .grid{gap:14px}
  .panel{margin-bottom:14px;border-radius:8px;overflow:visible}
  .panel h2{font-size:13px;padding:10px 12px;flex-wrap:wrap;gap:8px}
  .roundnav{width:100%;margin-left:0;justify-content:space-between}
  .roundnav select{flex:1}
  .roundnav button{width:38px;height:38px}
  table{font-size:13px}
  th,td{padding:8px 6px}
  .dot{width:7px;height:7px}
  .score{min-width:0}
  .match{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);padding:11px 8px;gap:6px}
  .match .h,.match .v{white-space:nowrap}
  td.name{max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1><span class="fun">FUN</span>TASY <span class="tag">DRAFT</span></h1>
  <div class="sub" id="sub">FPL Draft · head-to-head</div>
  <div id="status">Betöltés…</div>
</header>

<div class="grid">
  <div>
    <div class="panel">
      <h2>Tabella</h2>
      <div id="tableBanner"></div>
      <div class="tablewrap"><table id="table"></table></div>
      <div class="note">Győzelem 3 · döntetlen 1 · vereség 0. Holtversenynél a pontkülönbség (GK) dönt, utána a szerzett pont (RG) —
      ugyanaz a sorrend, mint az NB I-es oldalon.</div>
    </div>
    <div class="panel">
      <h2>Egymás ellen</h2>
      <div class="matrix" id="matrix"></div>
      <div class="note">Sor vs oszlop: <span class="pos">GY</span>/<span style="color:var(--draw)">D</span>/<span class="neg">V</span></div>
    </div>
  </div>
  <div>
    <div class="panel">
      <h2>Legutóbbi forduló
        <span class="roundnav">
          <button data-nav="past" data-d="-1">‹</button>
          <select id="selPast"></select>
          <button data-nav="past" data-d="1">›</button>
        </span>
      </h2>
      <div id="mPast"></div>
    </div>
    <div class="panel">
      <h2>Következő forduló
        <span class="roundnav">
          <button data-nav="next" data-d="-1">‹</button>
          <select id="selNext"></select>
          <button data-nav="next" data-d="1">›</button>
        </span>
      </h2>
      <div id="mNext"></div>
    </div>
    <div class="panel">
      <h2>A mezőny</h2>
      <div id="entries"></div>
    </div>
  </div>
</div>
</div>

<script>
// ======= KONFIGURÁCIÓ =======
// A ligán belüli azonosító (league_entry id) és az NB I-es oldal beceneve
// közötti megfeleltetés. Ez a leendő összesítő oldal csatolótáblájának a magja:
// ugyanaz az ember a két ligában más néven szerepel, itt kötjük össze őket.
//
// A kulcs a league_entry "id", NEM az FPL "entry_id" — a draft.json is az
// előbbit tartalmazza, és a matches/standings is arra hivatkozik.
//
// Aki csak az egyik ligában játszik, az nem szerepel itt:
//   - csak a Draftban: Not arsenal (271009), LastYear'sProblem (327399),
//     One More Last Ride (360593)
//   - csak az NB I-ben: Sámsi
const NEVEK = {
  254810: "Bence",    // Első Legitim Bajnok
  254960: "Ádám",     // Fixtop4
  267429: "Katyul",   // Kiderül
  267607: "Bazsa",    // Maduekinho
  267857: "Csendi",   // Hol van a pénz?
  268988: "Vince",    // HolVanSalah?!
  277905: "Csongi",   // Egyperegy
};
// ============================

const $ = id => document.getElementById(id);
const fmt = x => (Math.round(x*100)/100).toLocaleString('hu-HU',{maximumFractionDigits:2});
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const played = m => m[2]!=null && m[3]!=null;

let DATA=null, ENTRIES={}, SCHEDULE={}, R1=1, RN=38, rPast=1, rNext=1;

// A ligán belüli azonosítóból megjelenítendő nevet csinál.
// FIGYELEM: a matches és a standings a league_entry "id"-jára hivatkozik,
// nem az FPL "entry_id"-ra. A draft.json már csak az előbbit tartalmazza.
function nev(id){
  if(NEVEK[id]) return NEVEK[id];
  const e=ENTRIES[id];
  return e ? (e.name || e.short || ('#'+id)) : ('#'+id);
}
function rovid(id){
  const e=ENTRIES[id];
  return e && e.short ? e.short : String(id).slice(-3);
}
// Másodlagos, halványan kiírt címke a név mellé: akinél becenevet mutatunk,
// ott a csapatneve, a többieknél a monogramja.
function masodik(id){
  const e=ENTRIES[id];
  if(!e) return '';
  return NEVEK[id] ? (e.name||'') : (e.short||'');
}

function rounds(){ const a=[]; for(let r=R1;r<=RN;r++) a.push(r); return a; }
function matches(r){ return SCHEDULE[r] || []; }
function lastPlayedRound(){ let r=0; for(const i of rounds()) if(matches(i).some(played)) r=i; return r; }

// ---------- tabella ----------
function computeTable(){
  const T={};
  Object.keys(ENTRIES).forEach(id=>{T[id]={M:0,GY:0,D:0,V:0,RG:0,KG:0,form:[]};});
  for(const r of rounds()) for(const m of matches(r)){
    if(!played(m)) continue;
    const [h,v,hp,vp]=m;
    if(!T[h]||!T[v]) continue;
    T[h].M++;T[v].M++;T[h].RG+=hp;T[h].KG+=vp;T[v].RG+=vp;T[v].KG+=hp;
    if(hp>vp){T[h].GY++;T[v].V++;T[h].form.push('GY');T[v].form.push('V');}
    else if(vp>hp){T[v].GY++;T[h].V++;T[v].form.push('GY');T[h].form.push('V');}
    else {T[h].D++;T[v].D++;T[h].form.push('D');T[v].form.push('D');}
  }
  return Object.entries(T).map(([id,s])=>({id,...s,GK:s.RG-s.KG,Pont:s.GY*3+s.D}))
    .sort((a,b)=>b.Pont-a.Pont||b.GK-a.GK||b.RG-a.RG||nev(a.id).localeCompare(nev(b.id),'hu'));
}
function renderTable(){
  const sorok=computeTable();
  const lejatszott=lastPlayedRound();
  $('tableBanner').innerHTML = lejatszott ? '' :
    `<div class="banner">A szezon még nem kezdődött el — <b>egyetlen forduló sincs lezárva</b>.
     A menetrend és a mezőny már végleges, az eredmények az első forduló után jelennek meg.</div>`;
  let h=`<tr><th></th><th>Csapat</th><th>M</th><th>GY</th><th>D</th><th>V</th><th>RG</th><th>KG</th><th>GK</th><th>Pont</th><th>Forma</th></tr>`;
  sorok.forEach((r,i)=>{
    const form=r.form.slice(-5).map(f=>`<span class="dot ${f}"></span>`).join('');
    h+=`<tr><td class="rank">${i+1}.</td>
    <td class="name">${esc(nev(r.id))} <span class="mono">${esc(masodik(r.id))}</span></td>
    <td>${r.M}</td><td>${r.GY}</td><td>${r.D}</td><td>${r.V}</td>
    <td>${fmt(r.RG)}</td><td>${fmt(r.KG)}</td>
    <td class="${r.GK>=0?'pos':'neg'}">${fmt(r.GK)}</td>
    <td class="pont">${r.Pont}</td><td style="text-align:left"><span class="form">${form}</span></td></tr>`;
  });
  $('table').innerHTML=h;
}

// ---------- meccspanelek ----------
function fillSelect(sel){
  if(sel.options.length) return;
  for(const r of rounds()){
    const o=document.createElement('option');
    o.value=r; o.textContent=r+'. forduló'; sel.appendChild(o);
  }
}
function renderMatches(which){
  const r = which==='past'? rPast : rNext;
  const sel = which==='past'? $('selPast') : $('selNext');
  fillSelect(sel); sel.value=r;
  const lista=matches(r);
  let h='';
  if(!lista.length) h='<div class="note">Ehhez a fordulóhoz nincs meccs.</div>';
  for(const m of lista){
    const [ho,ve,hp,vp]=m, p=played(m);
    h+=`<div class="match">
      <div class="h ${p&&hp>vp?'winner':''}">${esc(nev(ho))}</div>
      <div class="score">${p?`${fmt(hp)} <span style="color:var(--dim)">:</span> ${fmt(vp)}`:'<span class="na">— : —</span>'}</div>
      <div class="v ${p&&vp>hp?'winner':''}">${esc(nev(ve))}</div></div>`;
  }
  (which==='past'? $('mPast') : $('mNext')).innerHTML=h;
}

// ---------- mátrix ----------
function renderMatrix(){
  const ids=computeTable().map(r=>r.id), M={};
  ids.forEach(a=>{M[a]={};ids.forEach(b=>M[a][b]=[0,0,0]);});
  for(const r of rounds()) for(const m of matches(r)){
    if(!played(m))continue;
    const [h,v,hp,vp]=m; if(!M[h]||!M[v])continue;
    if(hp>vp){M[h][v][0]++;M[v][h][2]++;}
    else if(vp>hp){M[v][h][0]++;M[h][v][2]++;}
    else {M[h][v][1]++;M[v][h][1]++;}
  }
  let t='<table><tr><th></th>'+ids.map(i=>`<th>${esc(rovid(i))}</th>`).join('')+'</tr>';
  for(const a of ids){
    t+=`<tr><th style="text-align:left;white-space:nowrap">${esc(nev(a))}</th>`;
    for(const b of ids){
      if(a===b){t+='<td class="x">—</td>';continue;}
      const [w,d,l]=M[a][b], n=w+d+l;
      t+=`<td class="${n? (w>l?'w':(l>w?'l':'d')) : 'x'}">${n? w+'/'+d+'/'+l : '·'}</td>`;
    }
    t+='</tr>';
  }
  $('matrix').innerHTML=t+'</table>';
}

// ---------- mezőny ----------
function renderEntries(){
  const lista=Object.values(ENTRIES).sort((a,b)=>nev(a.id).localeCompare(nev(b.id),'hu'));
  let h='<table>';
  for(const e of lista){
    const csapat = NEVEK[e.id] ? ` <span class="mono">${esc(e.name)}</span>` : '';
    h+=`<tr><td class="name">${esc(nev(e.id))}${csapat}</td>
        <td class="mono" style="text-align:right">${esc(e.short)}</td></tr>`;
  }
  $('entries').innerHTML=h+'</table>';
}

// ---------- betöltés ----------
function boot(){
  // A draft.premierleague.com böngészőből CORS miatt nem hívható, ezért nincs
  // "Frissítés" gomb: az adatot a collect_draft.py gyűjti szerveroldalon.
  fetch('draft.json?t='+Date.now())
    .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(j=>{
      DATA=j;
      (j.entries||[]).forEach(e=>{ENTRIES[e.id]=e;});
      SCHEDULE=j.schedule||{};
      R1=(j.league&&j.league.start_event)||1;
      RN=(j.league&&j.league.stop_event)||38;

      const lp=lastPlayedRound();
      rPast = lp || R1;
      rNext = lp ? Math.min(RN, matches(lp).every(played)? lp+1 : lp) : R1;

      const nevek=(j.league&&j.league.name)||'FPL Draft';
      $('sub').textContent = `FPL Draft · ${nevek} · ${Object.keys(ENTRIES).length} csapat · ${R1}–${RN}. forduló`;
      const d=j.updated? new Date(j.updated) : null;
      $('status').textContent = d? ('Frissítve: '+d.toLocaleString('hu-HU')) : '';
      $('status').className='ok';

      renderTable(); renderMatrix(); renderMatches('past'); renderMatches('next'); renderEntries();
    })
    .catch(e=>{
      $('status').textContent='Nem sikerült betölteni a draft.json-t: '+e.message;
      $('status').className='err';
    });
}

document.addEventListener('click',ev=>{
  const b=ev.target.closest('button[data-nav]');
  if(!b) return;
  const which=b.dataset.nav, d=+b.dataset.d;
  if(which==='past') rPast=Math.min(RN,Math.max(R1,rPast+d));
  else               rNext=Math.min(RN,Math.max(R1,rNext+d));
  renderMatches(which);
});
document.addEventListener('change',ev=>{
  if(ev.target===$('selPast')){ rPast=+ev.target.value; renderMatches('past'); }
  if(ev.target===$('selNext')){ rNext=+ev.target.value; renderMatches('next'); }
});

boot();
</script>
</body>
</html>
