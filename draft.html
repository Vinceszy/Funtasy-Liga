<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FunTasy Draft — H2H</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="funtasy.css">
</head>
<body>
<div class="wrap">
<header>
  <h1><span class="fun">FUN</span>TASY <span class="tag">DRAFT</span></h1>
  <div class="sub" id="sub">FPL Draft · privát head-to-head</div>
  <div id="status"></div>
</header>

<div class="grid">
  <div>
    <div class="panel">
      <h2>Tabella</h2>
      <div class="tablewrap"><table id="table"></table></div>
      <div class="note">Győzelem 3 · döntetlen 1 · vereség 0. Holtversenynél a pontkülönbség (GK) dönt, utána a rúgott (RG).</div>
    </div>
    <div class="panel">
      <h2>Egymás ellen</h2>
      <div class="matrix" id="matrix"></div>
      <div class="note">Sor vs oszlop: <span class="pos">GY</span>/<span style="color:var(--draw)">D</span>/<span class="neg">V</span></div>
    </div>
  </div>
  <div>
    <div class="panel">
      <h2>Legutóbbi forduló
        <span class="roundnav">
          <button data-nav="past" data-d="-1">‹</button>
          <select id="selPast"></select>
          <button data-nav="past" data-d="1">›</button>
        </span>
      </h2>
      <div id="mPast"></div>
    </div>
    <div class="panel">
      <h2>Következő forduló
        <span class="roundnav">
          <button data-nav="next" data-d="-1">‹</button>
          <select id="selNext"></select>
          <button data-nav="next" data-d="1">›</button>
        </span>
      </h2>
      <div id="mNext"></div>
    </div>
  </div>
</div>
</div>

<script src="funtasy.js"></script>
<script>
// ======= KONFIGURÁCIÓ =======
// A ligán belüli azonosító (league_entry id) és az NB I-es oldal beceneve
// közötti megfeleltetés — ugyanaz az ember a két ligában más néven szerepel.
// A kulcs a league_entry "id", NEM az FPL "entry_id".
// Aki csak az egyik ligában játszik, az nem szerepel itt:
//   csak a Draftban: 271009, 327399, 360593 · csak az NB I-ben: Sámsi
const NEVEK = {
  254810: "Bence", 254960: "Ádám",  267429: "Katyul", 267607: "Bazsa",
  267857: "Csendi", 268988: "Vince", 277905: "Csongi"
};
// ============================

const $ = id => document.getElementById(id);
const ENTRIES = {};
const SCHEDULE = {};
let liga = {};

const T = FunTasy.create({
  entries:    () => Object.keys(ENTRIES).map(Number),
  schedule:   SCHEDULE,
  firstRound: () => liga.start_event || 1,
  lastRound:  () => liga.stop_event  || 38,
  nameHeader: 'Csapat',
  label:      id => NEVEK[id] || (ENTRIES[id] && ENTRIES[id].name) || ('#' + id),
  els: { table:'table', matrix:'matrix', mPast:'mPast', mNext:'mNext',
         selPast:'selPast', selNext:'selNext' }
});
T.bindNav();

// A draft.premierleague.com böngészőből CORS miatt nem hívható, ezért itt —
// az index.html-lel ellentétben — nincs "Frissítés" gomb: az adatot a
// collect_draft.py gyűjti szerveroldalon, 3 óránként.
fetch('draft.json?t=' + Date.now())
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(j => {
    (j.entries || []).forEach(e => { ENTRIES[e.id] = e; });
    for (const k in (j.schedule || {})) SCHEDULE[k] = j.schedule[k];
    liga = j.league || {};

    T.rPast = T.lastPlayedRound();
    T.rNext = T.nextRound();
    $('sub').textContent = `FPL Draft · ${liga.name || ''} · ${Object.keys(ENTRIES).length} csapat · ${liga.stop_event || 38} forduló`;
    const d = j.updated ? new Date(j.updated) : null;
    $('status').textContent = d ? ('Frissítve: ' + d.toLocaleString('hu-HU')) : '';
    $('status').className = 'ok';
    T.renderAll();
  })
  .catch(e => {
    $('status').textContent = 'Nem sikerült betölteni a draft.json-t: ' + e.message;
    $('status').className = 'err';
  });
</script>
</body>
</html>
