name: FPL napi zárás — időbeli felvétel
# EGYSZERI meres. A hetfoi meccs (2026-08-24 18:00 UTC) korul figyeljuk,
# mikor valt at az event-status "points" mezoje - ebbol derul ki, hogy a "p"
# a napi zaras jelzese-e. Kezzel is inditható.
on:
  schedule:
    - cron: '20 19 24 8 *'
  workflow_dispatch:
permissions: { contents: write }
jobs:
  meres:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name  "funtasy-diag"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          veg=$(( $(date +%s) + 300*60 ))
          while [ "$(date +%s)" -lt "$veg" ]; do
            python3 DIAG-FPL-idovonal.py >> DIAG-FPL-idovonal.txt || true
            if [ -n "$(git status --porcelain DIAG-FPL-idovonal.txt)" ]; then
              git add DIAG-FPL-idovonal.txt
              git commit -q -m "FPL idovonal" || true
              git pull -q --rebase origin main || true
              git push -q origin HEAD:main || true
            fi
            sleep 120
          done
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
