name: Napló-mérés (kézi)
# ONE workflow for every probe under naplo/, parameterised by the script
# name - otherwise every new question would breed a new, nearly identical
# workflow file. The development environment's network blocks every external
# source, so it runs from Actions. The probes only read and write the log.
#
# By default it writes to main: the probe results are needed where the
# articles are made from.
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'The probe to run (naplo/... .py)'
        required: true
      branch:
        description: 'The branch the result is written to'
        required: false
        default: 'main'
      environment:
        description: 'One NAME=value per line for the probe (e.g. HARVEST_EVENT=5)'
        required: false
        default: ''
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.inputs.branch }}' }
      - env:
          SCRIPT: ${{ github.event.inputs.script }}
          BRANCH: ${{ github.event.inputs.branch }}
          PROBE_ENV: ${{ github.event.inputs.environment }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Some probes get a key; the secret lives here, not in the
          # script. What is not set is empty - the probe itself decides
          # what to do with that.
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          # Only scripts under naplo/ run, and only .py: the workflow input
          # must not turn into running an arbitrary command.
          case "$SCRIPT" in
            naplo/*.py) ;;
            *) echo "only naplo/*.py can be run: $SCRIPT"; exit 1;;
          esac
          case "$SCRIPT" in
            *..*) echo "must not contain '..'"; exit 1;;
          esac
          [ -f "$SCRIPT" ] || { echo "no such file: $SCRIPT"; exit 1; }
          # Some probes expect a parameter (which round, how many days).
          # ONE "NAME=value" per line; a strict pattern, passed on with
          # `export`, not `eval` - so the input cannot become a command.
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            case "$line" in
              [A-Z_]*=*) ;;
              *) echo "malformed environment variable: $line"; exit 1;;
            esac
            case "$line" in
              *[\`\$\;\|\&\<\>\(\)]*)
                echo "forbidden character: $line"; exit 1;;
            esac
            export "${line%%=*}=${line#*=}"
          done <<EOF
          $PROBE_ENV
          EOF
          git config user.name  "funtasy-figyelo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          python3 "$SCRIPT"
          # Whatever the probe wrote is committed - not only under naplo/. A
          # harvest may put a data file in the root as well, and a version
          # narrowed to naplo/ would silently drop it.
          [ -z "$(git status --porcelain)" ] && exit 0
          git add -A
          git commit -q -m "Meres eredmenye: $(basename "$SCRIPT")"
          for i in 1 2 3; do
            git pull -q --rebase origin "$BRANCH" && git push -q origin "HEAD:$BRANCH" && exit 0
            sleep $((i * 5))
          done
          exit 1
