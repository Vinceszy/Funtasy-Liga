name: Napló-mérés (kézi)
# EGY workflow minden naplo-mereshez, a szkript nevevel parameterezve -
# kulonben minden uj kerdes egy uj, majdnem azonos workflow-fajlt szulne.
# A fejlesztoi kornyezet halozata minden kulso forrast blokkol, ezert megy
# Actionsbol. A meresek csak olvasnak es a naplot irjak.
#
# Alapbol a MUNKAAGRA ir, nem a main-re.
on:
  workflow_dispatch:
    inputs:
      szkript:
        description: 'A futtatando meres (naplo/... .py)'
        required: true
      branch:
        description: 'Melyik agra irja az eredmenyt'
        required: false
        default: 'claude/github-claude-code-integration-x4pk4k'
      kornyezet:
        description: 'Soronkent egy NEV=ertek a meresnek (pl. HARVEST_EVENT=5)'
        required: false
        default: ''
permissions: { contents: write }
jobs:
  meres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.inputs.branch }}' }
      - env:
          SZKRIPT: ${{ github.event.inputs.szkript }}
          AG: ${{ github.event.inputs.branch }}
          KORNYEZET: ${{ github.event.inputs.kornyezet }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A meresek egy resze kulcsot kap; a titok itt all, nem a
          # szkriptben. Ami nincs beallitva, az ures - a meres maga dont
          # arrol, mit kezd vele.
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          # Csak a naplo alol futtatunk, es csak .py-t: a workflow bemenete
          # nem valhat tetszoleges parancs futtatasava.
          case "$SZKRIPT" in
            naplo/*.py) ;;
            *) echo "csak naplo/*.py futtathato: $SZKRIPT"; exit 1;;
          esac
          case "$SZKRIPT" in
            *..*) echo "nem tartalmazhat '..'-t"; exit 1;;
          esac
          [ -f "$SZKRIPT" ] || { echo "nincs ilyen fajl: $SZKRIPT"; exit 1; }
          # A meresek egy resze parametert var (melyik fordulo, hany nap).
          # Soronkent EGY "NEV=ertek"; szigoru minta, es `export`-tal adjuk
          # at, nem `eval`-lal - a bemenet igy nem valhat parancsca.
          while IFS= read -r sor; do
            [ -z "$sor" ] && continue
            case "$sor" in
              [A-Z_]*=*) ;;
              *) echo "rossz alaku kornyezeti valtozo: $sor"; exit 1;;
            esac
            case "$sor" in
              *[\`\$\;\|\&\<\>\(\)]*)
                echo "tiltott karakter: $sor"; exit 1;;
            esac
            export "${sor%%=*}=${sor#*=}"
          done <<EOF
          $KORNYEZET
          EOF
          git config user.name  "funtasy-figyelo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          python3 "$SZKRIPT"
          # Amit a meres irt, azt commitoljuk - nem csak a naplo alatt. Egy
          # gyujtes a gyokerbe is tehet adatfajlt, es a naplora szukitett
          # valtozat azt csendben eldobta volna.
          [ -z "$(git status --porcelain)" ] && exit 0
          git add -A
          git commit -q -m "Meres eredmenye: $(basename "$SZKRIPT")"
          for i in 1 2 3; do
            git pull -q --rebase origin "$AG" && git push -q origin "HEAD:$AG" && exit 0
            sleep $((i * 5))
          done
          exit 1
