name: FPL csere-mérés (egyszeri, GW1 zárás)
# EGYSZERI meres: a fordulo vegen atirja-e az FPL a pick "position" mezojet
# (automatikus csere), es melyik mezo jelzi a VEGLEGES fordulo-zarast.
# A site mukodeset NEM erinti: csak olvas, es a naplo/ konyvtarba ir.
#
# Ket ablak, mert egy Actions-futas legfeljebb 6 ora:
#   - kezi inditas MOST (a GW1 utolso meccse 2026-08-24 20:50 UTC-kor ert veget)
#   - cron 2026-08-25 04:00 UTC, a masnap reggeli zarasra (09:00 UK = 08:00 UTC)
# A GitHub cron keses akar egy ora is lehet, ezert indul negy oraval a
# varhato esemeny elott. Ha megvan a valasz, ez a workflow es a
# naplo/fpl-cserek.txt torolheto.
on:
  schedule:
    - cron: '0 4 25 8 *'
  workflow_dispatch:
permissions: { contents: write }
concurrency:
  group: fpl-cseremeres
  cancel-in-progress: false
jobs:
  meres:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name  "funtasy-figyelo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          ment() {
            [ -z "$(git status --porcelain naplo/fpl-cserek.txt)" ] && return
            git add naplo/fpl-cserek.txt
            git commit -q -m "Csere-meres mintak"
            for i in 1 2 3; do
              git pull -q --rebase origin main && git push -q origin HEAD:main && return
              sleep $((i * 5))
            done
          }
          # 5,5 ora, 10 percenkent. Az elso mintat rogton mentjuk (egy kezi
          # inditas igy azonnal ad adatot), utana felorankent.
          veg=$(( $(date +%s) + 330*60 )); n=0
          while [ "$(date +%s)" -lt "$veg" ]; do
            python3 naplo/fpl-csere-meres.py || true
            n=$((n + 1))
            { [ $n -eq 1 ] || [ $((n % 3)) -eq 0 ]; } && ment
            sleep 600
          done
          ment
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
