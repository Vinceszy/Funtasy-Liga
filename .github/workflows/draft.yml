---
name: FPL Draft frissitese

# Runs every 3 hours (at :47) and also hourly between 07:00 and 13:00 UTC (at
# :37), always at a minute offset from archive.yml (two collectors pushing at
# once race on main), and can be started by hand. The endpoints work from a server.
#
# Why the morning is dense: a round's close (current_event_finished) is only
# seen by a run, and the FPL closes a round the morning after its last match
# (flipped at 08:03-08:23 UTC; every close so far was recorded by the
# collector between 08:52 and 13:01 UTC). With a 3-hour schedule, thinned out
# further by the runs GitHub skips, the close went unrecorded for hours. The
# rest of the day has nothing to catch: the browser fetches the live score.
#
# And because GitHub drops scheduled runs, sometimes every one of a whole
# morning, a run that finds a played but unclosed round restarts the
# workflow itself 20 minutes later (the `retry` job, on the collector's
# `pending` output): a dispatched run is not skipped. The chain stops when
# the close is recorded, or after 40 attempts (~13 hours) - a round played
# on Monday evening closes the next morning, well inside that.
on:
  schedule:
    - cron: '47 */3 * * *'
    - cron: '37 7-13 * * *'
  workflow_dispatch:
    inputs:
      league_id:
        description: 'A Draft-liga azonositoja (ures = a szkript alapertelmezese)'
        required: false
        default: ''
      attempt:
        description: 'Ujraprobalkozas sorszama (a retry job tolti ki)'
        required: false
        default: '0'

permissions:
  contents: write
  # the retry job starts this workflow again (workflow_dispatch)
  actions: write

concurrency:
  group: funtasy-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    # A hanging API must not hold the concurrency group for hours.
    timeout-minutes: 30
    outputs:
      pending: ${{ steps.collect.outputs.pending }}
    steps:
      - name: Repo letoltese
        uses: actions/checkout@v4

      - name: FPL Draft liga lekerese
        id: collect
        env:
          DRAFT_LEAGUE_ID: ${{ inputs.league_id }}
        run: |
          if [ -z "$DRAFT_LEAGUE_ID" ]; then unset DRAFT_LEAGUE_ID; fi
          python3 collect_draft.py

      - name: Valtozas commitolasa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "funtasy-archiver"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # the 'draft*.json' glob matches only the files that exist - with an
          # explicit list, a single file that did not exist yet invalidated
          # the WHOLE add, and /dev/null swallowed the error
          git add -A -- 'draft*.json' zarasok.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Draft-adat frissites ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            # on a push conflict: rebase + retry - an unguarded push throws
            # away the result of a whole run when another workflow has
            # written to main in the meantime
            for i in 1 2 3; do
              git push origin HEAD:${GITHUB_REF_NAME} && exit 0
              git pull --rebase origin ${GITHUB_REF_NAME}
              sleep $((i * 5))
            done
            exit 1
          fi

  # A played round is not closed yet: try again in 20 minutes. Waiting here
  # instead of on the schedule, because the schedule is what GitHub skips.
  retry:
    needs: draft
    if: needs.draft.outputs.pending != '' && fromJSON(inputs.attempt || '0') < 40
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Varakozas, majd ujrainditas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATTEMPT: ${{ inputs.attempt || '0' }}
          LEAGUE: ${{ inputs.league_id }}
          PENDING: ${{ needs.draft.outputs.pending }}
        run: |
          echo "Round $PENDING is played but not closed - attempt $((ATTEMPT + 1)) in 20 minutes."
          sleep 1200
          gh workflow run draft.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f attempt="$((ATTEMPT + 1))" -f league_id="$LEAGUE"
