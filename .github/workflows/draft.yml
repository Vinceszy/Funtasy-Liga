---
name: FPL Draft frissitese

# Runs every 3 hours and hourly in the morning, always at a minute offset from
# archive.yml (two collectors pushing at once race on main), and can be
# started by hand. The endpoints work from a server.
#
# Why the morning is dense: a round's close (current_event_finished) is only
# seen by a run, and the FPL closes a round the morning after its last match
# (flipped at 08:03-08:23 UTC; every close so far was recorded by the
# collector between 08:52 and 13:01 UTC). With a 3-hour schedule, thinned out
# further by the runs GitHub skips, the close went unrecorded for hours. The
# rest of the day has nothing to catch: the browser fetches the live score.
on:
  schedule:
    - cron: '47 */3 * * *'
    - cron: '37 7-13 * * *'
  workflow_dispatch:
    inputs:
      league_id:
        description: 'A Draft-liga azonositoja (ures = a szkript alapertelmezese)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: funtasy-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    # A hanging API must not hold the concurrency group for hours.
    timeout-minutes: 30
    steps:
      - name: Repo letoltese
        uses: actions/checkout@v4

      - name: FPL Draft liga lekerese
        env:
          DRAFT_LEAGUE_ID: ${{ inputs.league_id }}
        run: |
          if [ -z "$DRAFT_LEAGUE_ID" ]; then unset DRAFT_LEAGUE_ID; fi
          python3 collect_draft.py

      - name: Valtozas commitolasa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "funtasy-archiver"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # a 'draft*.json' glob csak a letezo fajlokat fogja - a felsorolassal
          # az volt a baj, hogy egyetlen meg nem letezo fajl az EGESZ add-ot
          # ervenytelenitette, es a hibat a /dev/null elnyelte
          git add -A -- 'draft*.json' zarasok.json
          if git diff --cached --quiet; then
            echo "Nincs valtozas."
          else
            git commit -m "Draft-adat frissites ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            # push-utkozeskor rebase + ujraprobalkozas - az archive.yml
            # vedtelen push-a 2026-08-25-en egy teljes futas eredmenyet
            # eldobta, ugyanaz itt is megtortenhetett volna
            for i in 1 2 3; do
              git push origin HEAD:${GITHUB_REF_NAME} && exit 0
              git pull --rebase origin ${GITHUB_REF_NAME}
              sleep $((i * 5))
            done
            exit 1
          fi
