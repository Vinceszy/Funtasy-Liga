name: PL szín-forrás mérés (kézi)
# Honnan jon a Premier League-hez a szin (a gol MODJA, a vitatott itelet, a
# kihagyott nagy helyzet)? A magyar oldalon egy beszamolo prozaja adja; az
# angolhoz meg nincs forras bekotve. A meres negy jelolttel probalkozik, es a
# robots.txt-t is megnezi. Cikkszoveget NEM tarol: a talalt mondatok csak a
# futas naplojaban latszanak.
#
# A MUNKAAGRA ir, nem a main-re: amig nincs kesz, a main ne mozduljon.
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Hany napra visszamenoleg keressen lezart PL-meccset'
        required: false
        default: '10'
permissions: { contents: write }
jobs:
  meres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/github-claude-code-integration-x4pk4k }
      - env:
          PROBE_DAYS: ${{ github.event.inputs.days }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "funtasy-figyelo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          python3 naplo/pl-colour-probe.py
          [ -z "$(git status --porcelain naplo/pl-colour.txt)" ] && exit 0
          git add naplo/pl-colour.txt
          git commit -q -m "PL szin-forras meres eredmenye"
          for i in 1 2 3; do
            git pull -q --rebase origin claude/github-claude-code-integration-x4pk4k \
              && git push -q origin HEAD:claude/github-claude-code-integration-x4pk4k && exit 0
            sleep $((i * 5))
          done
          exit 1
