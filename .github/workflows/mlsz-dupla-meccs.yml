name: MLSZ dupla meccs-mérés (egyszeri, kézi)
# EGYSZERI meres: mit kuld az MLSZ, ha egy klubnak KET meccse van egy
# fantasy forduloban (potolt, elmaradt meccs)? A valasz csak AZ ERINTETT
# FORDULO ALATT merheto. Csak olvas; ha megvan a valasz, ez a workflow es a
# naplo-fajl torolheto.
on:
  workflow_dispatch:
    inputs:
      fordulo:
        description: 'A mert fordulo (ures = az MLSZ szerinti aktualis)'
        required: false
        default: ''
permissions: { contents: write }
jobs:
  meres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name  "funtasy-figyelo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          python3 naplo/mlsz-dupla-meccs-meres.py
          [ -z "$(git status --porcelain naplo/mlsz-dupla-meccs.txt)" ] && exit 0
          git add naplo/mlsz-dupla-meccs.txt
          git commit -q -m "Dupla meccs-meres eredmenye"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          MERES_FORDULO: "${{ inputs.fordulo }}"
