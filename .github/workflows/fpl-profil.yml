name: FPL profil-mérés (egyszeri, kézi)
# EGYSZERI meres a jatekosprofil-funkciohoz: megvan-e egy PL-jatekos EGESZ
# szezonja egy keresbol (element-summary), es egyeznek-e az azonositok a
# Draft-jatekkal. Csak olvas; ha megvan a valasz, ez a workflow es a
# naplo-fajl torolheto.
on:
  workflow_dispatch:
permissions: { contents: write }
jobs:
  meres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name  "funtasy-figyelo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          python3 naplo/fpl-profil-meres.py
          [ -z "$(git status --porcelain naplo/fpl-profil.txt)" ] && exit 0
          git add naplo/fpl-profil.txt
          git commit -q -m "FPL profil-meres eredmenye"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
