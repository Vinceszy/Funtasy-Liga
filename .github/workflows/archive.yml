name: Adatok frissítése

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: funtasy-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repó letöltése
        uses: actions/checkout@v4

      - name: Eredmények lekérése
        run: python3 collect.py

      - name: Változás commitolása
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "funtasy-archiver"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A results.json squads.json squad_history.json meccsek.json hatekonysag.json jatekosok.json arak.json zarasok_nb1.json keretek 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nincs változás."
          else
            git commit -m "Adatfrissítés ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            # A push kozben mas workflow is irhat a main-re (naplok, meresek) -
            # rebase-elve ujraprobalkozunk, ahogy a tobbi workflow is teszi.
            # E nelkul a futas minden eredmenye elveszett mar egyszer.
            for i in 1 2 3; do
              git push origin HEAD:${GITHUB_REF_NAME} && exit 0
              git pull --rebase origin ${GITHUB_REF_NAME}
              sleep $((i * 5))
            done
            exit 1
          fi
