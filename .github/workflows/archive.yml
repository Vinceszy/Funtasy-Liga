name: Adatok frissítése

on:
  schedule:
    # HOURLY ON MATCH DAYS, every three hours otherwise.
    #
    # Measured (rounds 1-8, 47 matches): the NB1 plays Thursday to Monday -
    # Sunday 43%, Saturday 32%, Friday 17%, Monday 6%, Thursday 2% -, and not
    # a single match fell on Tuesday or Wednesday. Kick-offs fall between
    # 14:00 and 20:00 local time, and the market closes roughly two hours
    # before the round's first match.
    #
    # Why it matters: the collector can first request squads at the moment
    # the market closes (until then the endpoint answers 403). Round 9's
    # market closed on Saturday at 12:45, the next scheduled run did not
    # come, and round 9's squads stayed unpublished for four and a half hours.
    #
    # Also measured: GitHub DROPS more than half of the scheduled starts.
    # '17 */3' promised eight a day, the reality was 3-4 a day, with regular
    # gaps of 7-9 hours. An hourly schedule does not give 24 runs either -
    # it makes a dropped start cost one hour instead of three.
    - cron: '17 * * * 4,5,6,0,1'
    - cron: '17 */3 * * 2,3'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: funtasy-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # A hanging API must not hold the shared concurrency group for hours.
    timeout-minutes: 30
    steps:
      - name: Repó letöltése
        uses: actions/checkout@v4

      - name: Eredmények lekérése
        run: python3 collect.py

      - name: Változás commitolása
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "funtasy-archiver"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Only the paths that exist: with an explicit list, one missing file
          # made the whole `git add` fail, and the error was swallowed - every
          # run would then report "no change" while nothing reached main.
          for f in results.json squads.json squad_history.json meccsek.json hatekonysag.json guardiola.json keretvaltozasok.json jatekosok.json arak.json zarasok_nb1.json keretek bontasok; do
            if [ -e "$f" ]; then git add -A -- "$f"; else echo "::warning::missing: $f"; fi
          done
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Adatfrissítés ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            # Another workflow can write to main during the push (logs,
            # probes) - so we rebase and retry, as the other workflows do.
            # Without this a rejected push loses every result of the run.
            for i in 1 2 3; do
              git push origin HEAD:${GITHUB_REF_NAME} && exit 0
              git pull --rebase origin ${GITHUB_REF_NAME}
              sleep $((i * 5))
            done
            exit 1
          fi
