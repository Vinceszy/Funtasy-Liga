name: Adatok frissítése

on:
  schedule:
    - cron: '17 */3 * * *'    # 3 óránként (keretek frissen tartása)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: funtasy-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lekérés az MLSZ API-ból
        run: python3 archive.py

      - name: Változás commitolása
        run: |
          if [[ -n "$(git status --porcelain results.json squads.json)" ]]; then
            git config user.name  "funtasy-archiver"
            git config user.email "actions@github.com"
            git add results.json squads.json
            git commit -m "Adatfrissítés ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            git push
          else
            echo "Nincs változás."
          fi
