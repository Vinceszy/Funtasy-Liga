name: Adatok frissítése

on:
  schedule:
    # MECCSNAPON ORANKENT, egyebkent haromoránként.
    #
    # Mert megmertuk (1-8. fordulo, 47 meccs): az NB1 csutortoktol hetfoig
    # jatszik - vasarnap 43%, szombat 32%, pentek 17%, hetfo 6%, csutortok 2%
    # -, keddre es szerdara EGYETLEN meccs sem esett. A kezdesek 14:00 es
    # 20:00 helyi ido koze esnek, a piaczaras pedig nagyjabol ket oraval az
    # adott fordulo elso meccse ele.
    #
    # Miert szamit: a gyujto a piaczaras pillanataban tud eloszor keretet
    # kerni (addig a vegpont 403-at ad). A 9. fordulo piaca szombat 12:45-kor
    # zart, es a kovetkezo utemezett futas nem jott meg - a 9. fordulo keretei
    # negy es fel oran at nem kerultek ki.
    #
    # Es mert ezt is megmertuk: a GitHub az utemezett inditasok tobb mint
    # felet ELDOBJA. A '17 */3' napi nyolcat igert, a valosag napi 3-4 volt,
    # rendszeres 7-9 oras lyukakkal. Az orankenti utemezes sem ad 24 futast -
    # azt adja, hogy egy eldobott inditas egy orat keruljon, ne harmat.
    - cron: '17 * * * 4,5,6,0,1'
    - cron: '17 */3 * * 2,3'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: funtasy-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repó letöltése
        uses: actions/checkout@v4

      - name: Eredmények lekérése
        run: python3 collect.py

      - name: Változás commitolása
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "funtasy-archiver"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A results.json squads.json squad_history.json meccsek.json hatekonysag.json guardiola.json keretvaltozasok.json jatekosok.json arak.json zarasok_nb1.json keretek bontasok 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nincs változás."
          else
            git commit -m "Adatfrissítés ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            # A push kozben mas workflow is irhat a main-re (naplok, meresek) -
            # rebase-elve ujraprobalkozunk, ahogy a tobbi workflow is teszi.
            # E nelkul a futas minden eredmenye elveszett mar egyszer.
            for i in 1 2 3; do
              git push origin HEAD:${GITHUB_REF_NAME} && exit 0
              git pull --rebase origin ${GITHUB_REF_NAME}
              sleep $((i * 5))
            done
            exit 1
          fi
