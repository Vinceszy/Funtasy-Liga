name: CORS-proxy mérés (egyszeri, kézi)
# EGYSZERI meres a 2026-08-27-i elo-lekeres-leallashoz: a corsproxy.io 401-et
# ad, az allorigins nem valaszol - melyik proxy mukodik meg? Csak olvas
# (kulso API-kat), az eredmenyt a naplo/proxy-meres.txt-be irja. Ha megvan a
# valasz, ez a workflow torolheto - a kovetkeztetes a README-be kerul.
on:
  workflow_dispatch:
permissions: { contents: write }
jobs:
  meres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name  "funtasy-figyelo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          python3 naplo/proxy-meres.py
          [ -z "$(git status --porcelain naplo/proxy-meres.txt)" ] && exit 0
          git add naplo/proxy-meres.txt
          git commit -q -m "Proxy-meres eredmenye"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
