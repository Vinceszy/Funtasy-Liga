name: MLSZ élő meccs-mérés (egyszeri, kézi)
# EGYSZERI meres: megkaphato-e ELO fordulonal a meccs ket klubja? A valasz
# csak ELO fordulo alatt merheto - lezaras utan az API amugy is adja a
# csapatokat. Csak olvas; ha megvan a valasz, ez a workflow es a naplo-fajl
# torolheto.
on:
  workflow_dispatch:
    inputs:
      fordulo:
        description: 'A mert fordulo (ures = az MLSZ szerinti aktualis)'
        required: false
        default: ''
permissions: { contents: write }
jobs:
  meres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name  "funtasy-figyelo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          python3 naplo/mlsz-elo-meccs-meres.py
          [ -z "$(git status --porcelain naplo/mlsz-elo-meccs.txt)" ] && exit 0
          git add naplo/mlsz-elo-meccs.txt
          git commit -q -m "Elo meccs-meres eredmenye"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          MERES_FORDULO: "${{ inputs.fordulo }}"
