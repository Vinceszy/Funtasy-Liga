name: FPL perc-mérés (egyszeri, GW1 záró meccs)
# EGYSZERI meres a "ki van meg a palyan" funkcio elokeszitesehez.
# A GW1 utolso meccse: 2026-08-24 19:00 UTC. 18:40-tol figyelunk, ~3,5 oran at,
# ket percenkent. A site mukodeset NEM erinti: csak olvas, es a naplo/
# konyvtarba ir. Ha megvan a valasz, ez a workflow es a naplo/fpl-percek.txt
# torolheto.
on:
  schedule:
    - cron: '40 18 24 8 *'
  workflow_dispatch:
permissions: { contents: write }
concurrency:
  group: fpl-percmeres
  cancel-in-progress: false
jobs:
  meres:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name  "funtasy-figyelo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # A mintavetel ket percenkent megy, de NEM commitolunk mintankent -
          # az 3,5 ora alatt ~100 commit lenne a main-en. Felorankent mentunk,
          # es a vegen meg egyszer.
          ment() {
            [ -z "$(git status --porcelain naplo/fpl-percek.txt)" ] && return
            git add naplo/fpl-percek.txt
            git commit -q -m "Perc-meres mintak"
            for i in 1 2 3; do
              git pull -q --rebase origin main && git push -q origin HEAD:main && return
              sleep $((i * 5))
            done
          }
          veg=$(( $(date +%s) + 210*60 )); n=0
          while [ "$(date +%s)" -lt "$veg" ]; do
            python3 naplo/fpl-perc-meres.py || true
            n=$((n + 1))
            # az ELSO mintat rogton mentjuk, utana felorankent - igy egy kezi
            # inditas azonnal ad adatot, nem kell fel orat varni ra
            { [ $n -eq 1 ] || [ $((n % 15)) -eq 0 ]; } && ment
            sleep 120
          done
          ment
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
