name: FPL forduló-állapot figyelése
# IDEIGLENES megfigyeles. Azt nezzuk, hogy a fordulo tenyleg csak a lockdownkor
# zarul-e le (2026/27: az utolso meccs utani nap 09:00 UK), vagy megis vannak
# napi zarasok. A szkript csak VALTOZASKOR ir sort, tehat a naplo rovid marad.
# Ha kiderult, amit tudni akartunk, ez a workflow es a naplo/ torolheto.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions: { contents: write }
concurrency:
  group: fpl-naplo
  cancel-in-progress: false
jobs:
  figyeles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 naplo/fpl-figyelo.py
      - run: |
          if [ -n "$(git status --porcelain naplo/fpl-allapot.txt)" ]; then
            git config user.name  "funtasy-figyelo"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git add naplo/fpl-allapot.txt
            git commit -q -m "FPL allapot-valtozas"
            for i in 1 2 3; do
              git pull -q --rebase origin main && git push -q origin HEAD:main && break
              sleep $((i * 5))
            done
          fi
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
