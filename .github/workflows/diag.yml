name: Egyszeri felderítés (FPL bónusz)
on: { workflow_dispatch: }
permissions: { contents: write }
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 DIAG-fpl.py > DIAG-eredmeny.txt 2>&1 || true
      - run: |
          git config user.name  "funtasy-diag"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A DIAG-eredmeny.txt
          git diff --cached --quiet || { git commit -m "Felderites eredmenye"; git push origin HEAD:${GITHUB_REF_NAME}; }
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
