---
name: MLSZ API diagnosztika (ideiglenes)

# IDEIGLENES munkafolyamat: csak kezzel inditható, csak olvas, semmit nem
# commitol. Ha a diagnosztika lezarult, ez a fajl es a DIAG-keret.py torolheto.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Repo letoltese
        uses: actions/checkout@v4

      - name: MLSZ API diagnosztika
        run: python3 DIAG-keret.py
