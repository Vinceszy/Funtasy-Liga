name: Tároló-mérés (kézi)
# A Worker "utolso ismert allas" tarolojanak VEGPONTROL-VEGPONTIG merese.
# Azert Actions-bol megy, mert a fejlesztoi kornyezet halozata nem enged ki
# a workers.dev-re - a Worker logikajat ott csak hamis KV-vel lehet merni
# (tesztek/workertarolo.teszt.js). Csak olvas es a naplot irja.
on:
  workflow_dispatch:
    inputs:
      uname:
        description: 'A mert szakvezeto MLSZ-felhasznaloneve (ures = HolVanSalah)'
        required: false
        default: ''
permissions: { contents: write }
jobs:
  meres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name  "funtasy-figyelo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          python3 naplo/tarolo-meres.py
          [ -z "$(git status --porcelain naplo/tarolo-meres.txt)" ] && exit 0
          git add naplo/tarolo-meres.txt
          git commit -q -m "Tarolo-meres eredmenye"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          MERES_UNAME: "${{ inputs.uname }}"
