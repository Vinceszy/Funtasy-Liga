<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FunTasy — ligák</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="funtasy.css?v=7">
</head>
<body>
<div class="wrap">
<header>
  <h1><span class="fun">FUN</span>TASY</h1>
  <div class="sub">Privát fantasy-ligák — head-to-head tabellával, keretekkel, élő állással</div>
</header>

<div class="panel">
  <h2>Ligák</h2>
  <div class="ligakartyak" id="ligak"></div>
  <div class="note">Az adatok három óránként frissülnek automatikusan; a folyamatban lévő
  forduló állása a liga oldalán élőben is lekérhető.</div>
</div>
</div>

<script src="funtasy.js?v=7"></script>
<script>
// A kartyak ugyanabbol a listabol keszulnek, mint a liga-oldalak valtosavja
// (funtasy.js -> LIGAK), tehat uj liga felvetele ott egyetlen sor.
document.getElementById('ligak').innerHTML = FunTasy.LIGAK.map(l =>
  `<a class="ligakartya" data-liga="${FunTasy.esc(l.id)}" href="${FunTasy.esc(l.mappa)}">
     <h2>${FunTasy.esc(l.nev)}</h2>
     <div class="kartyacim">${FunTasy.esc(l.cim)}</div>
     <div class="kartyaleiras">${FunTasy.esc(l.leiras)}</div>
     <span class="tovabb">Megnyitás →</span>
   </a>`).join('');
</script>
</body>
</html>
