<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FunTasy — ligák</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- A betukeszlet-ivet NEM blokkolokent toltjuk. Egy sima <link rel=stylesheet>
     megallitja a lap megjeleneset, amig a Google valaszol: kimerve DOMContentLoaded
     57 ms helyett 12,6 MASODPERC, ha a fonts.googleapis.com nem elerheto - addig
     a lapon SEMMI nincs. A media="print" + onload trukk aszinkronna teszi: a
     tartalom azonnal latszik a tartalek betuvel (a `display=swap` miatt ugyis az
     lenne az elso festes), es a webfont akkor lep be, amikor megjott. -->
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<noscript><link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap"></noscript>
<link rel="stylesheet" href="funtasy.css?v=67">
</head>
<body class="kezdolap">
<div class="wrap">
<noscript><div class="note nojs">Ehhez az oldalhoz <b>JavaScript</b> kell: a táblázatokat a
  böngésző tölti fel a mentett adatokból. JavaScript nélkül csak az üres keret látszik.</div></noscript>
<header>
  <h1><span class="fun">FUN</span>TASY</h1>
  <div class="sub">Privát fantasy-ligák — head-to-head tabellával, keretekkel, élő állással</div>
</header>

<div class="panel">
  <h2>Ligák</h2>
  <div class="ligakartyak" id="ligak"></div>
  <div class="note">A liga oldala megnyitáskor élő állást tölt. Ha az élő lekérés éppen
  nem elérhető, a háromóránként mentett adat látszik — ezt az oldal ki is írja.</div>
</div>

<a class="ujdonsagsor" href="valtozasok/">
  <span class="cim">Mi újult meg?</span>
  <span class="leiras">Új funkciók és javítások, ligánként szűrhetően.</span>
  <span class="tovabb">→</span>
</a>
<div class="lablec" id="lablec"></div>
</div>

<script src="funtasy.js?v=67"></script>
<script>
// A kartyak ugyanabbol a listabol keszulnek, mint a liga-oldalak valtosavja
// (funtasy.js -> LIGAK), tehat uj liga felvetele ott egyetlen sor.
// A kartyan a liga neve mellett a JATEKMODJA is ott van (salary cap / draft),
// mert az mondja meg, milyen szabalyok szerint megy. Ha egyszer sok liga lesz,
// ugyanez a mezo (l.tipus) adja majd a csoportositast is.
document.getElementById('ligak').innerHTML = FunTasy.LIGAK.map(l =>
  `<a class="ligakartya" data-liga="${FunTasy.esc(l.id)}" data-tipus="${FunTasy.esc(l.tipus)}" href="${FunTasy.esc(l.mappa)}">
     <div class="fejsor">
       <h2>${FunTasy.esc(l.nev)}</h2>
       <span class="tipuscimke">${FunTasy.esc(l.tipusNev)}</span>
     </div>
     <div class="kartyaleiras">${FunTasy.esc(l.leiras)}</div>
     <span class="tovabb">Megnyitás →</span>
   </a>`).join('');
FunTasy.renderLablec('');
</script>
</body>
</html>
