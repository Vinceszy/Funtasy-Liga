<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FunTasy Liga — H2H</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1F16; --panel:#12291D; --panel2:#0E2418; --line:#2E4A38;
  --ink:#F2EFE6; --dim:#9DB3A4; --amber:#FFB020; --magenta:#E5378B;
  --win:#3DDC84; --lose:#E5533D; --draw:#9DB3A4;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;min-height:100vh;
  background-image:radial-gradient(ellipse at 50% -10%, #16301F 0%, transparent 60%);}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px 20px;border-bottom:3px solid var(--amber);padding-bottom:14px;margin-bottom:22px}
h1{font-family:'Archivo Black';font-size:clamp(26px,5vw,40px);letter-spacing:.5px}
h1 .fun{color:var(--amber)} h1 .tag{color:var(--magenta)}
.sub{color:var(--dim);font-size:13px}
.btn{margin-left:auto;background:var(--amber);color:#1A1200;border:0;font:700 14px Inter;padding:10px 18px;border-radius:6px;cursor:pointer}
.btn:hover{filter:brightness(1.08)} .btn:disabled{opacity:.5;cursor:wait}
.btn.ghost{background:transparent;color:var(--amber);border:1px solid var(--amber)}
#status{font:500 12px 'JetBrains Mono';color:var(--dim);width:100%;min-height:16px}
#status.err{color:var(--lose)} #status.ok{color:var(--win)}
.grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.panel h2{font-family:'Archivo Black';font-size:15px;letter-spacing:1.5px;text-transform:uppercase;color:var(--amber);
  padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:600 11px Inter;letter-spacing:1px;text-transform:uppercase;color:var(--dim);text-align:right;padding:8px 10px;border-bottom:1px solid var(--line)}
th:first-child,th:nth-child(2){text-align:left}
td{padding:9px 10px;border-bottom:1px solid var(--panel2);text-align:right;font-family:'JetBrains Mono';font-size:13.5px}
td.name{font-family:Inter;font-weight:700;text-align:left;font-size:14px}
td.rank{text-align:left;color:var(--dim);width:30px}
tr:nth-child(1) td.rank{color:var(--amber)} 
td.pont{color:var(--amber);font-weight:700;font-size:15px}
.pos{color:var(--win)} .neg{color:var(--lose)}
.form{display:inline-flex;gap:3px;vertical-align:middle}
.dot{width:9px;height:9px;border-radius:2px;display:inline-block}
.dot.GY{background:var(--win)} .dot.V{background:var(--lose)} .dot.D{background:var(--draw)}
.roundnav{display:flex;align-items:center;gap:8px;margin-left:auto}
.roundnav button{background:var(--panel2);border:1px solid var(--line);color:var(--ink);width:30px;height:30px;border-radius:6px;cursor:pointer;font-size:15px}
.roundnav select{background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:5px 8px;border-radius:6px;font:600 13px Inter}
.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--panel2)}
.match .h{text-align:right;font-weight:700}.match .v{text-align:left;font-weight:700}
.match .winner{color:var(--amber)}
.score{font-family:'JetBrains Mono';font-weight:700;font-size:16px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;white-space:nowrap;min-width:130px;text-align:center}
.score .na{color:var(--dim);font-weight:500}
.matrix{padding:14px;overflow-x:auto}
.matrix table{font-size:11px}
.matrix td,.matrix th{padding:5px 6px;text-align:center;font-family:'JetBrains Mono'}
.matrix td.w{color:var(--win)} .matrix td.l{color:var(--lose)} .matrix td.d{color:var(--draw)} .matrix td.x{color:#3a5245}
.note{color:var(--dim);font-size:12px;padding:12px 16px;line-height:1.5}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--amber);border-radius:10px;max-width:640px;width:92%;padding:20px}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog textarea{width:100%;height:200px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;font:12px 'JetBrains Mono';padding:10px;margin:12px 0}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1><span class="fun">FUN</span>TASY <span class="tag">LIGA</span></h1>
  <div class="sub">NB I Fantasy · privát head-to-head · 8 szakvezető · 33 forduló</div>
  <button class="btn" id="refreshBtn" onclick="refresh(false)">⟳ Frissítés most</button>
  
  <div id="status"></div>
</header>

<div class="grid">
  <div class="panel">
    <h2>Tabella</h2>
    <table id="table"></table>
    <div class="note">Pontozás: győzelem 3 · döntetlen 1 · vereség 0. Holtversenynél: pontkülönbség (GK), majd rúgott (RG). Az RG/KG a heti fantasy-pontok összege.</div>
  </div>
  <div>
    <div class="panel" style="margin-bottom:22px">
      <h2>Meccsek
        <span class="roundnav">
          <button onclick="chRound(-1)">‹</button>
          <select id="roundSel" onchange="setRound(+this.value)"></select>
          <button onclick="chRound(1)">›</button>
        </span>
      </h2>
      <div id="matches"></div>
    </div>
    <div class="panel">
      <h2>Egymás ellen</h2>
      <div class="matrix" id="matrix"></div>
      <div class="note">Sor vs oszlop, lejátszott meccsek: <span class="pos">GY</span>/<span style="color:var(--draw)">D</span>/<span class="neg">V</span></div>
    </div>
  </div>
</div>
</div>



<script>
// ====== KONFIGURÁCIÓ — itt szerkeszthető ======
const MEMBERS = {
  "Katyul":"peterkmrs", "Bence":"Dill Dough", "Sámsi":"samsonp", "Vince":"HolVanSalah",
  "Bazsa":"Hoxha98", "Csongi":"szcsngr", "Csendi":"cspeti93", "Ádám":"siuu_1885"
};
const COMPETITION = 3;
// SCHEDULE: {forduló: [[hazai, vendég, hazaiPont, vendégPont], ...]}
const SCHEDULE = {"1": [["Bazsa", "Katyul", 50.75, 56.75], ["Csongi", "Bence", 48.5, 47.38], ["Csendi", "Vince", 47.0, 50.75], ["Sámsi", "Ádám", 45.0, 52.38]], "2": [["Bazsa", "Csongi", 62.0, 45.37], ["Katyul", "Bence", 71.13, 55.25], ["Csendi", "Sámsi", 51.88, 43.12], ["Vince", "Ádám", 55.01, 60.25]], "3": [["Bazsa", "Bence", 72.75, 73.0], ["Katyul", "Csongi", 66.13, 59.0], ["Csendi", "Ádám", 55.38, 47.25], ["Vince", "Sámsi", 60.88, 79.75]], "4": [["Bazsa", "Csendi", 51.63, 63.63], ["Katyul", "Vince", 81.25, 75.75], ["Csongi", "Sámsi", 67.13, 84.51], ["Bence", "Ádám", 82.38, 49.63]], "5": [["Bazsa", "Vince", null, null], ["Katyul", "Csendi", null, null], ["Csongi", "Ádám", null, null], ["Bence", "Sámsi", null, null]], "6": [["Bazsa", "Sámsi", null, null], ["Katyul", "Ádám", null, null], ["Csongi", "Csendi", null, null], ["Bence", "Vince", null, null]], "7": [["Bazsa", "Ádám", null, null], ["Katyul", "Sámsi", null, null], ["Csongi", "Vince", null, null], ["Bence", "Csendi", null, null]], "8": [["Bazsa", "Katyul", null, null], ["Csongi", "Bence", null, null], ["Csendi", "Vince", null, null], ["Sámsi", "Ádám", null, null]], "9": [["Bazsa", "Csongi", null, null], ["Katyul", "Bence", null, null], ["Csendi", "Sámsi", null, null], ["Vince", "Ádám", null, null]], "10": [["Bazsa", "Bence", null, null], ["Katyul", "Csongi", null, null], ["Csendi", "Ádám", null, null], ["Vince", "Sámsi", null, null]], "11": [["Bazsa", "Csendi", null, null], ["Katyul", "Vince", null, null], ["Csongi", "Sámsi", null, null], ["Bence", "Ádám", null, null]], "12": [["Bazsa", "Vince", null, null], ["Katyul", "Csendi", null, null], ["Csongi", "Ádám", null, null], ["Bence", "Sámsi", null, null]], "13": [["Bazsa", "Sámsi", null, null], ["Katyul", "Ádám", null, null], ["Csongi", "Csendi", null, null], ["Bence", "Vince", null, null]], "14": [["Bazsa", "Ádám", null, null], ["Katyul", "Sámsi", null, null], ["Csongi", "Vince", null, null], ["Bence", "Csendi", null, null]], "15": [["Bazsa", "Katyul", null, null], ["Csongi", "Bence", null, null], ["Csendi", "Vince", null, null], ["Sámsi", "Ádám", null, null]], "16": [["Bazsa", "Csongi", null, null], ["Katyul", "Bence", null, null], ["Csendi", "Sámsi", null, null], ["Vince", "Ádám", null, null]], "17": [["Bazsa", "Bence", null, null], ["Katyul", "Csongi", null, null], ["Csendi", "Ádám", null, null], ["Vince", "Sámsi", null, null]], "18": [["Bazsa", "Csendi", null, null], ["Katyul", "Vince", null, null], ["Csongi", "Sámsi", null, null], ["Bence", "Ádám", null, null]], "19": [["Bazsa", "Vince", null, null], ["Katyul", "Csendi", null, null], ["Csongi", "Ádám", null, null], ["Bence", "Sámsi", null, null]], "20": [["Bazsa", "Sámsi", null, null], ["Katyul", "Ádám", null, null], ["Csongi", "Csendi", null, null], ["Bence", "Vince", null, null]], "21": [["Bazsa", "Ádám", null, null], ["Katyul", "Sámsi", null, null], ["Csongi", "Vince", null, null], ["Bence", "Csendi", null, null]], "22": [["Bazsa", "Katyul", null, null], ["Csongi", "Bence", null, null], ["Csendi", "Vince", null, null], ["Sámsi", "Ádám", null, null]], "23": [["Bazsa", "Csongi", null, null], ["Katyul", "Bence", null, null], ["Csendi", "Sámsi", null, null], ["Vince", "Ádám", null, null]], "24": [["Bazsa", "Bence", null, null], ["Katyul", "Csongi", null, null], ["Csendi", "Ádám", null, null], ["Vince", "Sámsi", null, null]], "25": [["Bazsa", "Csendi", null, null], ["Katyul", "Vince", null, null], ["Csongi", "Sámsi", null, null], ["Bence", "Ádám", null, null]], "26": [["Bazsa", "Vince", null, null], ["Katyul", "Csendi", null, null], ["Csongi", "Ádám", null, null], ["Bence", "Sámsi", null, null]], "27": [["Bazsa", "Sámsi", null, null], ["Katyul", "Ádám", null, null], ["Csongi", "Csendi", null, null], ["Bence", "Vince", null, null]], "28": [["Bazsa", "Ádám", null, null], ["Katyul", "Sámsi", null, null], ["Csongi", "Vince", null, null], ["Bence", "Csendi", null, null]], "29": [["Bazsa", "Katyul", null, null], ["Csongi", "Bence", null, null], ["Csendi", "Vince", null, null], ["Sámsi", "Ádám", null, null]], "30": [["Bazsa", "Csongi", null, null], ["Katyul", "Bence", null, null], ["Csendi", "Sámsi", null, null], ["Vince", "Ádám", null, null]], "31": [["Bazsa", "Bence", null, null], ["Katyul", "Csongi", null, null], ["Csendi", "Ádám", null, null], ["Vince", "Sámsi", null, null]], "32": [["Bazsa", "Csendi", null, null], ["Katyul", "Vince", null, null], ["Csongi", "Sámsi", null, null], ["Bence", "Ádám", null, null]], "33": [["Bazsa", "Vince", null, null], ["Katyul", "Csendi", null, null], ["Csongi", "Ádám", null, null], ["Bence", "Sámsi", null, null]]};
// ==============================================

let curRound = (()=>{ // első eredmény nélküli forduló, vagy az utolsó
  for(let r=1;r<=33;r++){ if(SCHEDULE[r].some(m=>m[2]==null)) return Math.max(1,r-0); }
  return 33; })();

function played(m){ return m[2]!=null && m[3]!=null; }
function resOf(m,name){ // 'GY'/'D'/'V' az adott név szemszögéből
  const [h,v,hp,vp]=m; if(!played(m)) return null;
  if(hp===vp) return 'D';
  const winner = hp>vp ? h : v;
  return winner===name ? 'GY' : 'V';
}

function computeTable(){
  const T={}; Object.keys(MEMBERS).forEach(n=>T[n]={M:0,GY:0,D:0,V:0,RG:0,KG:0,form:[]});
  for(let r=1;r<=33;r++) for(const m of SCHEDULE[r]){
    if(!played(m)) continue;
    const [h,v,hp,vp]=m;
    T[h].M++; T[v].M++; T[h].RG+=hp; T[h].KG+=vp; T[v].RG+=vp; T[v].KG+=hp;
    if(hp>vp){T[h].GY++;T[v].V++;} else if(vp>hp){T[v].GY++;T[h].V++;} else {T[h].D++;T[v].D++;}
    T[h].form.push(resOf(m,h)); T[v].form.push(resOf(m,v));
  }
  return Object.entries(T).map(([n,s])=>({name:n,...s,GK:s.RG-s.KG,Pont:s.GY*3+s.D}))
    .sort((a,b)=>b.Pont-a.Pont||b.GK-a.GK||b.RG-a.RG);
}

function fmt(x){ return (Math.round(x*100)/100).toLocaleString('hu-HU',{minimumFractionDigits:0,maximumFractionDigits:2}); }

function renderTable(){
  const rows = computeTable();
  let h = `<tr><th></th><th>Szakvezető</th><th>M</th><th>GY</th><th>D</th><th>V</th><th>RG</th><th>KG</th><th>GK</th><th>Pont</th><th>Forma</th></tr>`;
  rows.forEach((r,i)=>{
    const form = r.form.slice(-5).map(f=>`<span class="dot ${f}"></span>`).join('');
    h+=`<tr><td class="rank">${i+1}.</td><td class="name">${r.name}</td><td>${r.M}</td><td>${r.GY}</td><td>${r.D}</td><td>${r.V}</td>
    <td>${fmt(r.RG)}</td><td>${fmt(r.KG)}</td><td class="${r.GK>=0?'pos':'neg'}">${fmt(r.GK)}</td>
    <td class="pont">${r.Pont}</td><td style="text-align:left"><span class="form">${form}</span></td></tr>`;
  });
  document.getElementById('table').innerHTML=h;
}

function renderMatches(){
  const sel=document.getElementById('roundSel');
  if(!sel.options.length){ for(let r=1;r<=33;r++){const o=document.createElement('option');o.value=r;o.textContent=r+'. forduló';sel.appendChild(o);} }
  sel.value=curRound;
  let h='';
  for(const m of SCHEDULE[curRound]){
    const [ho,ve,hp,vp]=m; const p=played(m);
    const hw=p&&hp>vp, vw=p&&vp>hp;
    h+=`<div class="match"><div class="h ${hw?'winner':''}">${ho}</div>
      <div class="score">${p?`${fmt(hp)} <span style="color:var(--dim)">:</span> ${fmt(vp)}`:'<span class="na">— : —</span>'}</div>
      <div class="v ${vw?'winner':''}">${ve}</div></div>`;
  }
  document.getElementById('matches').innerHTML=h;
}
function setRound(r){curRound=Math.min(33,Math.max(1,r));renderMatches();}
function chRound(d){setRound(curRound+d);}

function renderMatrix(){
  const names=Object.keys(MEMBERS);
  const M={}; names.forEach(a=>{M[a]={};names.forEach(b=>M[a][b]=[0,0,0]);});
  for(let r=1;r<=33;r++) for(const m of SCHEDULE[r]){
    if(!played(m))continue; const [h,v,hp,vp]=m;
    if(hp>vp){M[h][v][0]++;M[v][h][2]++;} else if(vp>hp){M[v][h][0]++;M[h][v][2]++;} else {M[h][v][1]++;M[v][h][1]++;}
  }
  let t='<table><tr><th></th>'+names.map(n=>`<th>${n.slice(0,4)}</th>`).join('')+'</tr>';
  for(const a of names){
    t+=`<tr><th style="text-align:left">${a}</th>`;
    for(const b of names){
      if(a===b){t+='<td class="x">—</td>';continue;}
      const [w,d,l]=M[a][b];
      const cls = w>l?'w':(l>w?'l':'d');
      t+=`<td class="${(w+d+l)?cls:'x'}">${w+d+l? w+'/'+d+'/'+l : '·'}</td>`;
    }
    t+='</tr>';
  }
  document.getElementById('matrix').innerHTML=t+'</table>';
}

// ===== Élő frissítés az MLSZ fantasy API-ból =====
const ROUTES = [
  {n:'direkt',  f:u=>u},
  {n:'allorigins', f:u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u)},
  {n:'codetabs',   f:u=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u)},
  {n:'thingproxy', f:u=>'https://thingproxy.freeboard.io/fetch/'+u},
  {n:'corsproxy',  f:u=>'https://corsproxy.io/?url='+encodeURIComponent(u)}
];
let goodRoute = null;
function fetchT(url, ms){                     // fetch időkorláttal
  const c = new AbortController();
  const t = setTimeout(()=>c.abort(), ms);
  return fetch(url, {signal:c.signal, headers:{'Accept':'application/json'}})
    .finally(()=>clearTimeout(t));
}
async function apiGet(url, label){
  const st=document.getElementById('status');
  const order = goodRoute ? [goodRoute,...ROUTES.filter(r=>r!==goodRoute)] : ROUTES;
  const errs=[];
  for(const rt of order){
    try{
      if(st) st.textContent = `Élő adatok lekérése… ${label}`;
      const res = await fetchT(rt.f(url), 8000);
      if(!res.ok){ errs.push(rt.n+':HTTP '+res.status); continue; }
      const txt = await res.text();
      let j; try{ j=JSON.parse(txt); }catch{ errs.push(rt.n+':nem JSON'); continue; }
      if(!j || !('data' in j)){ errs.push(rt.n+':hiányzó data'); continue; }
      goodRoute = rt;
      return j;
    }catch(e){
      errs.push(rt.n+':'+(e.name==='AbortError'?'időtúllépés':(e.name==='TypeError'?'CORS/blokkolt':e.message)));
    }
  }
  throw new Error(errs.join(' · '));
}
async function refresh(silent){
  const st=document.getElementById('status'), btn=document.getElementById('refreshBtn');
  btn.disabled=true; st.className=''; let filled=0, got={};
  try{
    let i=0, n=Object.keys(MEMBERS).length;
    for(const [name,uname] of Object.entries(MEMBERS)){
      i++;
      const u=`https://fantasy-api.mlsz.hu/competitions/${COMPETITION}/rankings?include=user_team.user.id,summary_statistics,ranking,rounds,competition_rank&page=1&per_page=5&filter%5Bsearch%5D=${encodeURIComponent(uname)}`;
      let j;
      try{ j = await apiGet(u, `(${i}/${n}) ${name}`); }
      catch(e){ if(!silent){ st.className='err'; st.textContent=`${name} (${uname}) nem jött le — ${e.message}`; } continue; }
      const row=(j.data||[]).find(d=>d.user_team?.user?.username===uname)||j.data?.[0];
      if(!row){ continue; }
      got[name]={};
      for(const rs of (row.user_team?.round_statistics||[])) got[name][rs.round_number]=rs.points;
    }
    for(let r=1;r<=33;r++) for(const m of SCHEDULE[r]){
      const [h,v]=m;
      if(m[2]==null && got[h]?.[r]!=null && got[v]?.[r]!=null){ m[2]=got[h][r]; m[3]=got[v][r]; filled++; }
    }
    renderTable();renderMatches();renderMatrix();
    st.className='ok';
    const now = new Date().toLocaleString('hu-HU',{hour:'2-digit',minute:'2-digit'});
    st.textContent = filled ? `Frissítve ${now} — ${filled} új meccseredmény érkezett.`
                            : `Naprakész (utolsó ellenőrzés: ${now})`;
  }catch(e){
    st.className='err';
    st.textContent = silent ? 'Az élő frissítés most nem elérhető — a tárolt állás látható.'
                            : 'Egyik útvonal sem jött össze — '+e.message;
  }
  btn.disabled=false;
}



// ===== Induláskor: archívum betöltése, majd élő frissítés =====
async function boot(){
  const st=document.getElementById('status');
  try{
    const r = await fetch('results.json?t='+Date.now());
    if(r.ok){
      const j = await r.json();
      if(j && j.schedule){
        for(const k in j.schedule) SCHEDULE[k] = j.schedule[k];
        renderTable(); renderMatches(); renderMatrix();
      }
    }
  }catch(e){ /* nincs results.json — marad a beépített adat */ }
  refresh(true);          // csendes élő frissítés
}
boot();
</script>
</body>
</html>
